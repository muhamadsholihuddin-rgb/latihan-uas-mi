bertemu huruf hijaiyah.", "soal": [{"level": "L1", "tanya": "QS. Al-'Adiyat diawali dengan gambaran kuda perang yang berlari ....", "opsi": ["kencang", "pelan-pelan", "berjalan santai", "berhenti"], "kunci": 0, "bahas": "Ayat pertama QS. Al-'Adiyat menggambarkan kuda perang yang berlari kencang."}, {"level": "L1", "tanya": "Menurut QS. At-Tin, manusia diciptakan Allah dalam bentuk yang ....", "opsi": ["paling lemah", "sebaik-baiknya", "biasa saja", "paling kecil"], "kunci": 1, "bahas": "QS. At-Tin ayat 4 menyatakan manusia diciptakan dalam bentuk yang sebaik-baiknya."}, {"level": "L1", "tanya": "Hukum mim sukun yang terjadi apabila mim sukun bertemu huruf ba disebut ....", "opsi": ["idgham mimi", "izhar syafawi", "ikhfa syafawi", "iqlab"], "kunci": 2, "bahas": "Mim sukun bertemu ba dibaca ikhfa syafawi dengan dengung dan bibir tidak rapat sepenuhnya."}, {"level": "L2", "tanya": "Seorang siswa mengejek temannya yang yatim dan menolak membantu ketika temannya kesulitan. Perilaku tersebut bertentangan dengan kandungan QS. ....", "opsi": ["At-Tin", "Al-'Adiyat", "Al-Fatihah", "Al-Ma'un"], "kunci": 3, "bahas": "QS. Al-Ma'un mencela orang yang menghardik anak yatim dan enggan memberikan bantuan."}, {"level": "L2", "tanya": "Bacaan mim sukun pada kata yang bertemu huruf mim harus dibaca ....", "opsi": ["jelas tanpa dengung", "dipantulkan", "ditebalkan", "dengung dan lebur"], "kunci": 3, "bahas": "Mim sukun bertemu mim termasuk idgham mimi sehingga dibaca lebur dengan dengung."}, {"level": "L2", "tanya": "Seorang anak rajin bersedekah kepada anak yatim. Sikap tersebut sesuai hadis yang menyebutkan bahwa orang yang memelihara anak yatim akan bersama Nabi Muhammad saw. di surga seperti ....", "opsi": ["dua bintang", "dua pintu", "dua jari yang berdekatan", "dua sayap"], "kunci": 2, "bahas": "Hadis Nabi mengibaratkan kedudukan pemelihara anak yatim bersama beliau seperti jari telunjuk dan jari tengah."}, {"level": "L3", "tanya": "Dua bacaan mim sukun sama-sama dibaca dengung, tetapi yang satu bertemu ba dan yang lain bertemu mim. Pasangan hukum yang tepat adalah ....", "opsi": ["izhar syafawi dan ikhfa syafawi", "ikhfa syafawi dan idgham mimi", "iqlab dan idgham mimi", "izhar halqi dan ikhfa syafawi"], "kunci": 1, "bahas": "Mim sukun bertemu ba adalah ikhfa syafawi, sedangkan mim sukun bertemu mim adalah idgham mimi."}, {"level": "L3", "tanya": "Seorang siswa mendapat nikmat sehat tetapi tidak pernah bersyukur dan enggan beribadah. Ia juga suka menolak membantu temannya. Dua surah yang paling tepat untuk menasihatinya adalah ....", "opsi": ["Al-'Adiyat dan Al-Ma'un", "At-Tin dan Al-Fil", "Al-'Adiyat dan Al-Kautsar", "Al-Ma'un dan Al-Lahab"], "kunci": 0, "bahas": "Al-'Adiyat mengingatkan sikap ingkar nikmat, sedangkan Al-Ma'un mengingatkan kewajiban peduli kepada sesama."}]}, {"kelas": 5, "mapel": "Bahasa Arab", "topik": "Anggota tubuh, profesi, dan kebun binatang", "materi": "Kosakata anggota tubuh antara lain ra'sun yang berarti kepala, 'ainun yang berarti mata, yadun yang berarti tangan, dan rijlun yang berarti kaki. Profesi yang dipelajari antara lain thabibun atau dokter, mudarrisun atau guru, dan fallahun atau petani. Kalimat sederhana dapat dibentuk dengan mubtada dan khabar, sedangkan kata sifat mengikuti kata benda yang disifatinya. Jangan tertukar: 'ainun berarti mata, sedangkan udzunun berarti telinga.", "soal": [{"level": "L1", "tanya": "Bahasa Arab kata kepala adalah ....", "opsi": ["ra'sun", "yadun", "rijlun", "'ainun"], "kunci": 0, "bahas": "Ra'sun berarti kepala."}, {"level": "L1", "tanya": "Kata thabibun berarti ....", "opsi": ["guru", "dokter", "petani", "pedagang"], "kunci": 1, "bahas": "Thabibun berarti dokter."}, {"level": "L1", "tanya": "Bahasa Arab kata gajah adalah ....", "opsi": ["asadun", "qirdun", "filun", "himarun"], "kunci": 2, "bahas": "Filun berarti gajah."}, {"level": "L2", "tanya": "Kalimat al-babu kabirun berarti ....", "opsi": ["pintu itu kecil", "jendela itu besar", "pintu itu terbuka", "pintu itu besar"], "kunci": 3, "bahas": "Al-babu berarti pintu dan kabirun berarti besar."}, {"level": "L2", "tanya": "Seorang guru laki-laki disebut ....", "opsi": ["mudarrisatun", "thalibun", "thabibun", "mudarrisun"], "kunci": 3, "bahas": "Mudarrisun berarti guru laki-laki, sedangkan mudarrisatun berarti guru perempuan."}, {"level": "L2", "tanya": "Kalimat yang menunjukkan kata sifat sesuai dengan kata benda perempuan adalah ....", "opsi": ["al-bintu mujtahidun", "al-bintu kabirun", "al-bintu mujtahidatun", "al-bintu sari'un"], "kunci": 2, "bahas": "Kata sifat untuk al-bintu yang berjenis perempuan menggunakan bentuk mujtahidatun."}, {"level": "L3", "tanya": "Siswa melihat hewan berkaki empat, berbelalai panjang, dan bertelinga lebar di kebun binatang. Hewan itu dalam bahasa Arab disebut ....", "opsi": ["asadun", "filun", "qirdun", "jamalun"], "kunci": 1, "bahas": "Hewan berbelalai panjang dan bertelinga lebar adalah gajah atau filun."}, {"level": "L3", "tanya": "Pasangan kata dan arti yang benar adalah ....", "opsi": ["'ainun berarti mata", "yadun berarti kaki", "rijlun berarti tangan", "udzunun berarti hidung"], "kunci": 0, "bahas": "'Ainun berarti mata, sedangkan udzunun berarti telinga."}]}, {"kelas": 5, "mapel": "Bahasa Indonesia", "topik": "Kata sifat, sinonim, antonim, majas, teks prosedur, dan surat pribadi", "materi": "Kata sifat menjelaskan sifat atau keadaan benda, orang, dan peristiwa. Sinonim adalah persamaan makna, sedangkan antonim adalah lawan makna. Majas adalah gaya bahasa yang menggunakan kata atau ungkapan tidak dalam makna sebenarnya, sedangkan teks prosedur berisi langkah-langkah melakukan sesuatu secara berurutan. Jangan tertukar: sinonim memiliki makna sama atau mirip, sedangkan antonim memiliki makna berlawanan.", "soal": [{"level": "L1", "tanya": "Kata yang termasuk kata sifat adalah ....", "opsi": ["berlari", "meja", "rajin", "kemarin"], "kunci": 2, "bahas": "Rajin menjelaskan sifat seseorang sehingga termasuk kata sifat."}, {"level": "L1", "tanya": "Sinonim kata gembira adalah ....", "opsi": ["sedih", "marah", "takut", "senang"], "kunci": 3, "bahas": "Gembira memiliki makna yang mirip dengan senang."}, {"level": "L1", "tanya": "Antonim kata tinggi adalah ....", "opsi": ["panjang", "besar", "lebar", "rendah"], "kunci": 3, "bahas": "Rendah adalah lawan makna dari tinggi."}, {"level": "L2", "tanya": "Kalimat angin berbisik di antara pepohonan mengandung majas ....", "opsi": ["hiperbola", "metafora", "personifikasi", "ironi"], "kunci": 2, "bahas": "Angin digambarkan dapat berbisik seperti manusia sehingga termasuk personifikasi."}, {"level": "L2", "tanya": "Bagian teks prosedur yang berisi urutan cara melakukan sesuatu disebut ....", "opsi": ["tujuan", "langkah-langkah", "penutup", "lampiran"], "kunci": 1, "bahas": "Langkah-langkah menjelaskan urutan tindakan dalam teks prosedur."}, {"level": "L2", "tanya": "Kalimat pembuka yang tepat untuk surat pribadi kepada sahabat adalah ....", "opsi": ["Hai, Rina. Apa kabar? Semoga kamu sehat selalu.", "Dengan hormat, saya mengajukan permohonan izin.", "Berdasarkan surat Bapak tertanggal 2 November...", "Demikian surat resmi ini kami sampaikan."], "kunci": 0, "bahas": "Surat pribadi menggunakan bahasa akrab dan ditujukan kepada orang yang dikenal dekat."}, {"level": "L3", "tanya": "Kalimat perpustakaan adalah gudang ilmu mengandung majas metafora karena ....", "opsi": ["perpustakaan dibandingkan secara langsung dengan gudang ilmu", "perpustakaan dapat berbicara", "kalimatnya berlebihan", "maknanya berlawanan dengan kenyataan"], "kunci": 0, "bahas": "Metafora membandingkan dua hal secara langsung tanpa kata pembanding."}, {"level": "L3", "tanya": "Urutan langkah membuat teh yang benar adalah ....", "opsi": ["tuang air panas, masukkan teh, siapkan gelas, tambahkan gula", "siapkan gelas, masukkan teh, tuang air panas, tambahkan gula", "tambahkan gula, siapkan gelas, tuang air panas, masukkan teh", "masukkan teh, tambahkan gula, siapkan gelas, tuang air panas"], "kunci": 1, "bahas": "Gelas disiapkan terlebih dahulu, kemudian teh dimasukkan, air panas dituangkan, dan gula ditambahkan."}]}, {"kelas": 5, "mapel": "Fikih", "topik": "Zakat fitrah, infak, sedekah, dan hikmah sosialnya", "materi": "Zakat fitrah wajib dikeluarkan oleh muslim yang mampu untuk dirinya dan orang yang menjadi tanggungannya. Zakat fitrah berupa makanan pokok sebanyak satu sha' dan sebaiknya diserahkan sebelum salat Idulfitri. Infak dan sedekah bersifat sukarela, sedangkan zakat fitrah merupakan kewajiban. Jangan tertukar: zakat fitrah tidak sama dengan zakat mal karena zakat fitrah berkaitan dengan jiwa dan bulan Ramadan.", "soal": [{"level": "L1", "tanya": "Hukum mengeluarkan zakat fitrah bagi muslim yang mampu adalah ....", "opsi": ["sunah", "makruh", "wajib", "mubah"], "kunci": 2, "bahas": "Zakat fitrah wajib dikeluarkan oleh muslim yang mampu pada bulan Ramadan."}, {"level": "L1", "tanya": "Zakat fitrah dikeluarkan dalam bentuk ....", "opsi": ["pakaian baru", "perhiasan", "kendaraan", "makanan pokok"], "kunci": 3, "bahas": "Zakat fitrah dikeluarkan berupa makanan pokok yang biasa dikonsumsi masyarakat."}, {"level": "L1", "tanya": "Waktu utama menyerahkan zakat fitrah adalah ....", "opsi": ["setelah salat Idulfitri", "pada malam takbiran tahun berikutnya", "setelah Iduladha", "sebelum salat Idulfitri"], "kunci": 3, "bahas": "Zakat fitrah sebaiknya diserahkan sebelum pelaksanaan salat Idulfitri."}, {"level": "L2", "tanya": "Sebuah keluarga terdiri atas ayah, ibu, dan dua anak. Zakat fitrah yang harus dikeluarkan ayah adalah untuk ....", "opsi": ["ayah saja", "ayah dan ibu saja", "empat orang", "dua anak saja"], "kunci": 2, "bahas": "Kepala keluarga mengeluarkan zakat fitrah untuk dirinya dan seluruh tanggungan keluarganya."}, {"level": "L2", "tanya": "Seorang siswa memberi uang kepada temannya yang membutuhkan tanpa mengharap balasan. Perbuatan tersebut termasuk ....", "opsi": ["zakat fitrah", "sedekah", "zakat mal", "fidyah"], "kunci": 1, "bahas": "Memberi bantuan secara sukarela kepada orang yang membutuhkan termasuk sedekah."}, {"level": "L2", "tanya": "Hikmah sosial zakat fitrah adalah ....", "opsi": ["membantu fakir miskin merayakan Idulfitri", "membuat penerima bergantung selamanya", "menambah kekayaan orang kaya", "mengganti kewajiban salat"], "kunci": 0, "bahas": "Zakat fitrah membantu fakir miskin memenuhi kebutuhan makanan pada hari raya."}, {"level": "L3", "tanya": "Seseorang menyerahkan zakat fitrah setelah salat Idulfitri selesai. Penyerahan tersebut dinilai ....", "opsi": ["sedekah biasa karena melewati waktu utama", "tetap zakat fitrah dan paling utama", "tidak bernilai apa-apa", "zakat mal"], "kunci": 0, "bahas": "Zakat fitrah yang diserahkan setelah salat Idulfitri dinilai sebagai sedekah biasa."}, {"level": "L3", "tanya": "Perbedaan zakat fitrah dan infak yang tepat adalah ....", "opsi": ["zakat fitrah sukarela, infak wajib", "zakat fitrah wajib, infak sukarela", "keduanya hanya dikeluarkan pada Ramadan", "keduanya hanya berupa uang"], "kunci": 1, "bahas": "Zakat fitrah hukumnya wajib bagi yang mampu, sedangkan infak dikeluarkan secara sukarela."}]}, {"kelas": 5, "mapel": "IPAS", "topik": "Sifat cahaya dan bunyi, rantai makanan, magnet, listrik, dan lapisan bumi", "materi": "Cahaya merambat lurus, dapat dipantulkan, dan dapat dibiaskan ketika melewati medium yang berbeda. Bunyi dihasilkan oleh benda yang bergetar dan memerlukan medium untuk merambat. Rantai makanan menunjukkan hubungan makan dan dimakan, sedangkan magnet memiliki kutub utara dan selatan. Jangan tertukar: benda konduktor mudah menghantarkan listrik, sedangkan isolator sulit menghantarkan listrik.", "soal": [{"level": "L1", "tanya": "Bunyi dihasilkan oleh benda yang ....", "opsi": ["bergetar", "diam", "berputar sangat lambat", "berubah warna"], "kunci": 0, "bahas": "Bunyi timbul karena adanya getaran pada sumber bunyi."}, {"level": "L1", "tanya": "Lapisan bumi yang paling luar disebut ....", "opsi": ["inti bumi", "kerak bumi", "mantel bumi", "magma"], "kunci": 1, "bahas": "Kerak bumi adalah lapisan terluar bumi tempat makhluk hidup berada."}, {"level": "L1", "tanya": "Kutub magnet yang sama apabila didekatkan akan ....", "opsi": ["tarik-menarik", "menyatu", "tolak-menolak", "hilang"], "kunci": 2, "bahas": "Kutub magnet yang sejenis akan tolak-menolak."}, {"level": "L2", "tanya": "Pensil yang dimasukkan ke dalam gelas berisi air tampak patah. Peristiwa tersebut menunjukkan cahaya dapat ....", "opsi": ["dipantulkan", "diserap", "diuraikan", "dibiaskan"], "kunci": 3, "bahas": "Pensil tampak patah karena cahaya dibiaskan ketika melewati air dan udara."}, {"level": "L2", "tanya": "Dalam rantai makanan, tumbuhan hijau berperan sebagai ....", "opsi": ["konsumen", "pengurai", "predator", "produsen"], "kunci": 3, "bahas": "Tumbuhan menghasilkan makanan sendiri melalui fotosintesis sehingga disebut produsen."}, {"level": "L2", "tanya": "Benda yang paling baik digunakan sebagai penghantar listrik adalah ....", "opsi": ["karet", "plastik", "tembaga", "kayu kering"], "kunci": 2, "bahas": "Tembaga merupakan konduktor listrik yang baik."}, {"level": "L3", "tanya": "Jika populasi belalang di sawah menurun drastis, dampak yang paling mungkin terjadi adalah ....", "opsi": ["populasi katak meningkat karena makanannya bertambah", "katak kekurangan makanan dan populasinya dapat menurun", "populasi padi berkurang karena dimakan katak", "ular langsung memakan padi"], "kunci": 1, "bahas": "Belalang merupakan makanan katak sehingga penurunan belalang dapat menyebabkan katak kekurangan makanan."}, {"level": "L3", "tanya": "Sebuah magnet didekatkan pada paku besi dan potongan plastik. Paku tertarik, sedangkan plastik tidak. Hal itu terjadi karena ....", "opsi": ["magnet hanya menarik benda tertentu seperti besi", "semua benda dapat ditarik magnet", "plastik lebih berat daripada besi", "magnet kehilangan kutubnya"], "kunci": 0, "bahas": "Magnet menarik benda magnetik seperti besi, tetapi tidak menarik plastik."}]}, {"kelas": 5, "mapel": "Matematika", "topik": "Bilangan sampai 100.000, KPK, FPB, operasi pecahan, serta keliling dan luas gabungan", "materi": "Bilangan sampai 100.000 dibaca berdasarkan nilai tempat puluh ribuan, ribuan, ratusan, puluhan, dan satuan. FPB digunakan untuk membagi benda sama rata sebanyak-banyaknya, sedangkan KPK digunakan untuk menentukan waktu bersama dari kegiatan berulang. Operasi pecahan dilakukan dengan menyamakan penyebut untuk penjumlahan dan pengurangan. Jangan tertukar: FPB mengambil faktor persekutuan terbesar, sedangkan KPK mengambil kelipatan persekutuan terkecil.", "soal": [{"level": "L1", "tanya": "Bilangan 76.409 dibaca ....", "opsi": ["tujuh ribu enam ratus empat puluh sembilan", "tujuh puluh enam ribu empat puluh sembilan", "tujuh ratus enam ribu empat ratus sembilan", "tujuh puluh enam ribu empat ratus sembilan"], "kunci": 3, "bahas": "76.409 terdiri atas 76 ribu, 4 ratus, dan 9 satuan."}, {"level": "L1", "tanya": "Nilai angka 5 pada bilangan 58.372 adalah ....", "opsi": ["5", "50", "5.000", "50.000"], "kunci": 3, "bahas": "Angka 5 berada pada tempat puluh ribuan sehingga nilainya 50.000."}, {"level": "L1", "tanya": "Hasil dari 3/8 + 2/8 adalah ....", "opsi": ["5/16", "1/8", "5/8", "6/8"], "kunci": 2, "bahas": "Pecahan berpenyebut sama dijumlahkan pembilangnya sehingga hasilnya 5/8."}, {"level": "L2", "tanya": "FPB dari 24 dan 36 adalah ....", "opsi": ["6", "12", "8", "72"], "kunci": 1, "bahas": "Faktor persekutuan terbesar dari 24 dan 36 adalah 12."}, {"level": "L2", "tanya": "Hasil dari 5/6 - 1/3 adalah ....", "opsi": ["1/2", "2/3", "4/9", "1/6"], "kunci": 0, "bahas": "1/3 diubah menjadi 2/6, sehingga 5/6 dikurangi 2/6 sama dengan 3/6 atau 1/2."}, {"level": "L2", "tanya": "Sebuah persegi panjang berukuran 12 cm x 7 cm. Kelilingnya adalah ....", "opsi": ["38 cm", "19 cm", "84 cm", "95 cm"], "kunci": 0, "bahas": "Keliling persegi panjang adalah 2 x (12 + 7) = 38 cm."}, {"level": "L3", "tanya": "Dua lampu menyala bersamaan. Lampu pertama menyala setiap 6 detik dan lampu kedua setiap 8 detik. Keduanya menyala bersamaan lagi setelah ....", "opsi": ["12 detik", "24 detik", "16 detik", "48 detik"], "kunci": 1, "bahas": "KPK dari 6 dan 8 adalah 24 sehingga keduanya menyala bersamaan lagi setelah 24 detik."}, {"level": "L3", "tanya": "Sebuah bangun gabungan terdiri atas persegi berukuran 6 cm x 6 cm dan persegi panjang berukuran 10 cm x 4 cm yang tidak tumpang tindih. Luas gabungannya adalah ....", "opsi": ["52 cm2", "66 cm2", "76 cm2", "96 cm2"], "kunci": 2, "bahas": "Luas persegi 36 cm2 ditambah luas persegi panjang 40 cm2 sama dengan 76 cm2."}]}, {"kelas": 5, "mapel": "Matematika (Sem 1)", "topik": "KPK dan FPB dalam Soal Cerita", "materi": "Pendalaman Materi: KPK dan FPB FPB mengambil faktor prima yang sama saja dengan pangkat terkecil (untuk membagi barang sama rata). KPK mengambil semua faktor prima dengan pangkat terbesar (untuk jadwal berulang bersamaan). Tabel Anti-Miskonsepsi Pertanyaan Soal Cara Menghitung Berapa paling banyak paket/kelompok yang dibuat? Nilai FPB langsung Berapa jumlah tiap jenis barang dalam satu paket? Jumlah masing-masing barang dibagi FPB Modul Pengayaan (3 Bilangan) Kasus: Lampu merah menyala tiap 4 detik, kuning tiap 6 detik, hijau tiap 8 detik. Kapan menyala bersamaan lagi? Kunci: $\\text{KPK}(4, 6, 8) = 2^3 \\times 3 = 24$ detik kemudian.", "soal": [{"level": "L1", "tanya": "Faktorisasi prima dari bilangan 36 adalah ....", "opsi": ["2 x 3^2", "2^2 x 3", "2^2 x 3^2", "2^3 x 3"], "kunci": 2, "bahas": "36 = 4 x 9 = 2^2 x 3^2."}, {"level": "L2", "tanya": "Perpustakaan MI menyiapkan 24 buku fikih dan 36 buku akidah untuk dibagikan sama banyak ke beberapa rak. Rak terbanyak yang dibutuhkan adalah ....", "opsi": ["6 rak", "12 rak", "18 rak", "72 rak"], "kunci": 1, "bahas": "FPB dari 24 (2^3 x 3) dan 36 (2^2 x 3^2) adalah 2^2 x 3 = 12 rak."}, {"level": "L3", "tanya": "Lampu hias masjid menyala merah setiap 4 detik, kuning setiap 6 detik, dan hijau setiap 8 detik. Jika menyala bersamaan pukul 18.00.00, ketiganya menyala bersamaan lagi pada pukul ....", "opsi": ["18.00.12", "18.00.16", "18.00.24", "18.00.48"], "kunci": 2, "bahas": "KPK dari 4 (2^2), 6 (2x3), dan 8 (2^3) adalah 2^3 x 3 = 24 detik. Jadi menyala bersamaan lagi pukul 18.00.24."}]}, {"kelas": 5, "mapel": "Pendidikan Pancasila", "topik": "Sejarah perumusan Pancasila dan macam-macam norma", "materi": "Pancasila dirumuskan melalui sidang BPUPKI dan Panitia Sembilan sebelum disahkan bersama Undang-Undang Dasar 1945 oleh PPKI pada 18 Agustus 1945. Norma dalam masyarakat meliputi norma agama, kesusilaan, kesopanan, dan hukum. Setiap norma memiliki sanksi yang berbeda, mulai dari sanksi batin dan sosial sampai sanksi hukum. Jangan tertukar: Piagam Jakarta adalah rumusan awal, sedangkan Pancasila yang berlaku disahkan pada 18 Agustus 1945.", "soal": [{"level": "L1", "tanya": "Pancasila disahkan sebagai dasar negara pada tanggal ....", "opsi": ["1 Juni 1945", "18 Agustus 1945", "22 Juni 1945", "17 Agustus 1945"], "kunci": 1, "bahas": "Pancasila disahkan dalam Undang-Undang Dasar 1945 oleh PPKI pada 18 Agustus 1945."}, {"level": "L1", "tanya": "Badan yang mengesahkan Undang-Undang Dasar 1945 adalah ....", "opsi": ["BPUPKI", "Panitia Sembilan", "PPKI", "MPR"], "kunci": 2, "bahas": "PPKI mengesahkan Undang-Undang Dasar 1945 pada 18 Agustus 1945."}, {"level": "L1", "tanya": "Norma yang sanksinya berupa hukuman dari negara adalah norma ....", "opsi": ["agama", "kesusilaan", "kesopanan", "hukum"], "kunci": 3, "bahas": "Pelanggaran norma hukum dikenai sanksi resmi oleh negara."}, {"level": "L2", "tanya": "Seorang siswa merasa bersalah setelah berbohong meskipun tidak diketahui orang lain. Sanksi batin tersebut berkaitan dengan norma ....", "opsi": ["hukum", "kesopanan", "adat", "kesusilaan"], "kunci": 3, "bahas": "Norma kesusilaan berhubungan dengan suara hati dan rasa bersalah."}, {"level": "L2", "tanya": "Mengucapkan permisi ketika melewati orang yang lebih tua menunjukkan norma ....", "opsi": ["hukum", "agama", "kesopanan", "kesusilaan"], "kunci": 2, "bahas": "Permisi merupakan perilaku sopan santun dalam pergaulan masyarakat."}, {"level": "L2", "tanya": "Rumusan Pancasila dalam Piagam Jakarta dihasilkan oleh ....", "opsi": ["PPKI", "Panitia Sembilan", "BPUPKI secara keseluruhan", "pemerintah Belanda"], "kunci": 1, "bahas": "Panitia Sembilan merumuskan Piagam Jakarta pada 22 Juni 1945."}, {"level": "L3", "tanya": "Seorang pengendara menerobos lampu merah dan dikenai tilang. Ia melanggar norma hukum karena perbuatannya ....", "opsi": ["diatur peraturan dan dikenai sanksi negara", "hanya menimbulkan rasa malu", "berkaitan dengan tata krama", "tidak membahayakan orang lain"], "kunci": 0, "bahas": "Menerobos lampu merah melanggar peraturan lalu lintas yang sanksinya diberikan oleh negara."}, {"level": "L3", "tanya": "Urutan peristiwa perumusan Pancasila yang benar adalah ....", "opsi": ["pidato 1 Juni, Piagam Jakarta, pengesahan 18 Agustus", "Piagam Jakarta, pidato 1 Juni, pengesahan 18 Agustus", "pengesahan 18 Agustus, Piagam Jakarta, pidato 1 Juni", "pidato 1 Juni, pengesahan 18 Agustus, Piagam Jakarta"], "kunci": 0, "bahas": "Pidato 1 Juni terjadi lebih dahulu, kemudian Piagam Jakarta pada 22 Juni, dan pengesahan pada 18 Agustus 1945."}]}, {"kelas": 5, "mapel": "SKI", "topik": "Pembinaan masyarakat Madinah, Piagam Madinah, dan Fathu Makkah", "materi": "Setelah hijrah ke Madinah, Nabi Muhammad saw. membangun persaudaraan antara kaum Muhajirin dan Ansar. Piagam Madinah mengatur hak, kewajiban, keamanan, dan kerja sama antara muslim dan kelompok masyarakat lain di Madinah. Fathu Makkah terjadi pada tahun 8 Hijriah dan Nabi memberikan pengampunan umum kepada penduduk Makkah. Jangan tertukar: Piagam Madinah dibuat di Madinah, sedangkan Fathu Makkah adalah peristiwa penaklukan kota Makkah secara damai.", "soal": [{"level": "L1", "tanya": "Kaum muslim yang hijrah dari Makkah ke Madinah disebut ....", "opsi": ["Ansar", "Quraisy", "Badui", "Muhajirin"], "kunci": 3, "bahas": "Muhajirin adalah kaum muslim yang berhijrah dari Makkah ke Madinah."}, {"level": "L1", "tanya": "Kaum muslim Madinah yang menolong para Muhajirin disebut ....", "opsi": ["Muhajirin", "Habasyah", "Thaif", "Ansar"], "kunci": 3, "bahas": "Ansar berarti penolong, yaitu kaum muslim Madinah yang membantu Muhajirin."}, {"level": "L1", "tanya": "Fathu Makkah terjadi pada tahun ....", "opsi": ["2 Hijriah", "5 Hijriah", "8 Hijriah", "10 Hijriah"], "kunci": 2, "bahas": "Fathu Makkah terjadi pada bulan Ramadan tahun 8 Hijriah."}, {"level": "L2", "tanya": "Isi penting Piagam Madinah adalah ....", "opsi": ["semua warga harus memeluk Islam", "setiap kelompok bertanggung jawab menjaga keamanan Madinah", "kaum Yahudi dilarang tinggal di Madinah", "perdagangan hanya boleh dilakukan kaum muslim"], "kunci": 1, "bahas": "Piagam Madinah menekankan persatuan dan tanggung jawab bersama dalam menjaga keamanan Madinah."}, {"level": "L2", "tanya": "Sikap Nabi Muhammad saw. ketika memasuki Makkah pada Fathu Makkah adalah ....", "opsi": ["memberikan pengampunan umum", "membalas semua musuhnya", "mengusir seluruh penduduk", "merusak rumah penduduk"], "kunci": 0, "bahas": "Nabi Muhammad saw. memberikan pengampunan umum kepada penduduk Makkah."}, {"level": "L2", "tanya": "Persaudaraan antara Muhajirin dan Ansar bertujuan ....", "opsi": ["memperkuat persatuan umat Islam", "memisahkan penduduk Madinah", "menghapus kegiatan perdagangan", "membatasi dakwah Islam"], "kunci": 0, "bahas": "Persaudaraan Muhajirin dan Ansar memperkuat persatuan dan kepedulian sosial umat Islam."}, {"level": "L3", "tanya": "Seorang siswa berkata bahwa Piagam Madinah hanya mengatur ibadah kaum muslim. Pernyataan yang lebih tepat adalah Piagam Madinah mengatur ....", "opsi": ["tata cara salat berjamaah", "hubungan sosial dan keamanan seluruh masyarakat Madinah", "pembagian zakat fitrah", "perjalanan haji"], "kunci": 1, "bahas": "Piagam Madinah mengatur kehidupan bersama, hak, kewajiban, dan keamanan masyarakat Madinah."}, {"level": "L3", "tanya": "Urutan peristiwa yang benar adalah ....", "opsi": ["Fathu Makkah, hijrah ke Madinah, Piagam Madinah", "Piagam Madinah, Fathu Makkah, hijrah ke Madinah", "hijrah ke Madinah, Piagam Madinah, Fathu Makkah", "hijrah ke Madinah, Fathu Makkah, Piagam Madinah"], "kunci": 2, "bahas": "Nabi hijrah ke Madinah, kemudian Piagam Madinah dibuat, dan Fathu Makkah terjadi beberapa tahun sesudahnya."}]}, {"kelas": 6, "mapel": "Akidah Akhlak", "topik": "Kalimat istighfar, Al-Ghaffar, Al-'Afuww, iman kepada qada dan qadar, sikap pemaaf, tanggung jawab, dan kisah Nabi Yunus a.s.", "materi": "Istighfar adalah permohonan ampun kepada Allah, misalnya dengan membaca astaghfirullah. Allah bersifat Al-Ghaffar yang berarti Maha Pengampun dan Al-'Afuww yang berarti Maha Pemaaf. Iman kepada qada dan qadar mengajarkan manusia untuk berikhtiar, berdoa, lalu bertawakal kepada Allah. Jangan tertukar: tawakal dilakukan setelah berusaha, bukan sebagai alasan untuk bermalas-malasan.", "soal": [{"level": "L1", "tanya": "Bacaan istighfar yang benar adalah ....", "opsi": ["Alhamdulillah", "Subhanallah", "Astaghfirullah", "Allahu Akbar"], "kunci": 2, "bahas": "Astaghfirullah berarti aku memohon ampun kepada Allah."}, {"level": "L1", "tanya": "Al-Ghaffar berarti Allah Maha ....", "opsi": ["Pemberi rezeki", "Melihat", "Mendengar", "Pengampun"], "kunci": 3, "bahas": "Al-Ghaffar berarti Allah Maha Pengampun dosa hamba-Nya."}, {"level": "L1", "tanya": "Al-'Afuww berarti Allah Maha ....", "opsi": ["Pencipta", "Perkasa", "Bijaksana", "Pemaaf"], "kunci": 3, "bahas": "Al-'Afuww berarti Allah Maha Pemaaf dan menghapus dosa."}, {"level": "L2", "tanya": "Seorang siswa belajar sungguh-sungguh, berdoa, lalu menyerahkan hasilnya kepada Allah. Sikap tersebut menunjukkan ....", "opsi": ["putus asa", "sombong", "ikhtiar dan tawakal", "pasrah tanpa usaha"], "kunci": 2, "bahas": "Berusaha dan berdoa kemudian menyerahkan hasil kepada Allah merupakan ikhtiar dan tawakal."}, {"level": "L2", "tanya": "Nabi Yunus a.s. berada di dalam perut ikan karena ....", "opsi": ["melawan perintah ayahnya", "meninggalkan kaumnya sebelum mendapat izin Allah", "menolak berdakwah sejak awal", "menyembunyikan wahyu"], "kunci": 1, "bahas": "Nabi Yunus meninggalkan kaumnya sebelum mendapat izin Allah sehingga ia diuji di dalam perut ikan."}, {"level": "L2", "tanya": "Sikap pemaaf ditunjukkan oleh siswa yang ....", "opsi": ["memaafkan teman yang meminta maaf", "membalas ejekan teman", "menyimpan dendam", "menghindari semua teman"], "kunci": 0, "bahas": "Memaafkan kesalahan orang yang meminta maaf menunjukkan sikap pemaaf."}, {"level": "L3", "tanya": "Perbedaan takdir mubram dan muallaq yang tepat adalah ....", "opsi": ["mubram pasti terjadi, muallaq berkaitan dengan sebab atau usaha", "mubram dapat diubah manusia, muallaq tidak dapat berubah", "keduanya tidak berhubungan dengan ketetapan Allah", "mubram hanya berlaku untuk orang kaya"], "kunci": 0, "bahas": "Takdir mubram bersifat pasti, sedangkan muallaq berkaitan dengan sebab yang diusahakan manusia."}, {"level": "L3", "tanya": "Seorang siswa gagal dalam lomba, lalu mengevaluasi kesalahan, berlatih lagi, dan tidak menyalahkan orang lain. Sikap tersebut menunjukkan ....", "opsi": ["menyerah pada keadaan", "tanggung jawab dan menerima qadar Allah", "sombong", "berputus asa"], "kunci": 1, "bahas": "Mengevaluasi diri dan berusaha lagi menunjukkan tanggung jawab serta penerimaan terhadap qadar Allah."}]}, {"kelas": 6, "mapel": "Al-Qur'an Hadis", "topik": "QS. Al-'Alaq, QS. Al-Qadr, hukum tafkhim, tarqiq, jawazul wajhain, dan hadis keutamaan memberi", "materi": "QS. Al-'Alaq ayat 1-5 merupakan wahyu pertama yang memerintahkan manusia membaca dan belajar. QS. Al-Qadr menjelaskan bahwa malam lailatulqadar lebih baik daripada seribu bulan. Bacaan ra dapat dibaca tafkhim atau tarqiq bergantung pada harakat dan keadaan huruf sebelumnya. Jangan tertukar: tafkhim berarti bacaan tebal, sedangkan tarqiq berarti bacaan tipis.", "soal": [{"level": "L1", "tanya": "Wahyu pertama yang diterima Nabi Muhammad saw. adalah QS. ....", "opsi": ["Al-Qadr ayat 1-5", "Al-'Alaq ayat 1-5", "Al-Ma'un ayat 1-7", "At-Tin ayat 1-8"], "kunci": 1, "bahas": "QS. Al-'Alaq ayat 1-5 merupakan wahyu pertama yang diterima Nabi Muhammad saw."}, {"level": "L1", "tanya": "Lailatulqadar lebih baik daripada ....", "opsi": ["seratus bulan", "satu tahun", "seribu bulan", "sepuluh tahun"], "kunci": 2, "bahas": "QS. Al-Qadr menyatakan lailatulqadar lebih baik daripada seribu bulan."}, {"level": "L1", "tanya": "Bacaan ra yang dibaca tebal disebut ....", "opsi": ["tarqiq", "izhar", "ikhfa", "tafkhim"], "kunci": 3, "bahas": "Tafkhim adalah cara membaca huruf dengan suara tebal."}, {"level": "L2", "tanya": "Perintah iqra dalam QS. Al-'Alaq menunjukkan pentingnya ....", "opsi": ["berdagang", "berperang", "berdiam diri", "membaca dan menuntut ilmu"], "kunci": 3, "bahas": "Kata iqra berarti bacalah sehingga menunjukkan pentingnya membaca dan belajar."}, {"level": "L2", "tanya": "Huruf ra berharakat kasrah pada umumnya dibaca ....", "opsi": ["tafkhim", "dengung", "tarqiq", "pantul"], "kunci": 2, "bahas": "Ra berharakat kasrah dibaca tarqiq atau tipis."}, {"level": "L2", "tanya": "Hadis tentang keutamaan memberi menyatakan bahwa tangan di atas lebih baik daripada tangan di bawah. Maksudnya adalah ....", "opsi": ["tangan harus selalu diangkat ketika berdoa", "orang yang memberi lebih utama daripada orang yang meminta-minta", "orang kaya tidak boleh menerima bantuan", "meminta selalu lebih baik daripada memberi"], "kunci": 1, "bahas": "Hadis tersebut mendorong umat Islam menjadi pemberi daripada peminta-minta."}, {"level": "L3", "tanya": "Suatu bacaan ra boleh dibaca tebal atau tipis karena memenuhi ketentuan tertentu. Hukum bacaan tersebut disebut ....", "opsi": ["jawazul wajhain", "izhar syafawi", "idgham mimi", "qalqalah kubra"], "kunci": 0, "bahas": "Jawazul wajhain berarti bacaan boleh dibaca dengan dua cara, yaitu tafkhim atau tarqiq."}, {"level": "L3", "tanya": "Seorang siswa rajin membaca Al-Qur'an dan bersedekah. Dua kandungan yang ia amalkan dari materi semester ini adalah ....", "opsi": ["perintah belajar dalam Al-'Alaq dan keutamaan memberi", "larangan menghardik yatim dan hukum mim sukun", "kisah Qarun dan zakat fitrah", "tanda waqaf dan ciri orang munafik"], "kunci": 0, "bahas": "Al-'Alaq memerintahkan belajar, sedangkan hadis keutamaan memberi mendorong kedermawanan."}]}, {"kelas": 6, "mapel": "Bahasa Arab", "topik": "Jam, aku suka Bahasa Arab, dan kegiatan ekstrakurikuler", "materi": "Penyebutan jam dalam bahasa Arab menggunakan kata as-sa'ah, misalnya as-sa'ah al-wahidah yang berarti pukul satu. Kata wa an-nisf menunjukkan lewat setengah jam, sedangkan illa rub'an menunjukkan kurang seperempat jam. Kegiatan ekstrakurikuler antara lain kurrat al-qadam atau sepak bola dan ar-rasm atau menggambar. Jangan tertukar: wa an-nisf berarti lewat tiga puluh menit, sedangkan illa rub'an berarti kurang lima belas menit.", "soal": [{"level": "L1", "tanya": "Bahasa Arab kata jam atau waktu adalah ....", "opsi": ["al-yaum", "as-sa'ah", "al-usbu'", "as-syahru"], "kunci": 1, "bahas": "As-sa'ah berarti jam atau waktu."}, {"level": "L1", "tanya": "As-sa'ah al-wahidah berarti pukul ....", "opsi": ["dua", "tiga", "satu", "empat"], "kunci": 2, "bahas": "Al-wahidah berarti satu sehingga as-sa'ah al-wahidah berarti pukul satu."}, {"level": "L1", "tanya": "Kurrat al-qadam berarti ....", "opsi": ["bola basket", "bulu tangkis", "renang", "sepak bola"], "kunci": 3, "bahas": "Kurrat al-qadam berarti sepak bola."}, {"level": "L2", "tanya": "Pukul dua lewat tiga puluh menit dalam bahasa Arab adalah ....", "opsi": ["as-sa'ah ats-tsaniyah illa rub'an", "as-sa'ah al-wahidah wa an-nisf", "as-sa'ah ats-tsalitsah illa rub'an", "as-sa'ah ats-tsaniyah wa an-nisf"], "kunci": 3, "bahas": "Pukul dua lewat tiga puluh menit disebut as-sa'ah ats-tsaniyah wa an-nisf."}, {"level": "L2", "tanya": "Kalimat uhibbu al-lughah al-'arabiyyah berarti ....", "opsi": ["saya belajar bahasa Arab", "saya menulis bahasa Arab", "saya suka bahasa Arab", "saya mengajar bahasa Arab"], "kunci": 2, "bahas": "Uhibbu berarti saya suka atau saya mencintai."}, {"level": "L2", "tanya": "Kegiatan menggambar dalam bahasa Arab disebut ....", "opsi": ["al-qira'ah", "ar-rasm", "al-kitabah", "al-musiqa"], "kunci": 1, "bahas": "Ar-rasm berarti menggambar."}, {"level": "L3", "tanya": "Pukul tiga kurang lima belas menit dalam bahasa Arab adalah ....", "opsi": ["as-sa'ah ats-tsalitsah illa rub'an", "as-sa'ah ats-tsalitsah wa an-nisf", "as-sa'ah ar-rabi'ah illa rub'an", "as-sa'ah ats-tsaniyah wa rub'un"], "kunci": 0, "bahas": "Kurang lima belas menit dinyatakan dengan illa rub'an."}, {"level": "L3", "tanya": "Kalimat yang benar untuk menyatakan saya suka sepak bola adalah ....", "opsi": ["uhibbu kurrat al-qadam", "uhibbu al-qira'ah", "ana mudarrisun", "huwā yal'abu"], "kunci": 0, "bahas": "Uhibbu kurrat al-qadam berarti saya suka sepak bola."}]}, {"kelas": 6, "mapel": "Bahasa Indonesia", "topik": "Laporan hasil pengamatan, teks eksplanasi ilmiah, formulir, surat resmi, dan unsur intrinsik cerpen", "materi": "Laporan hasil pengamatan ditulis berdasarkan fakta yang diamati secara langsung dan disusun secara sistematis. Teks eksplanasi ilmiah menjelaskan proses terjadinya suatu fenomena melalui pernyataan umum, deret penjelas, dan interpretasi. Surat resmi menggunakan bahasa baku dan memiliki bagian seperti kop surat, nomor, lampiran, perihal, salam pembuka, isi, dan tanda tangan. Jangan tertukar: unsur intrinsik berasal dari dalam cerita, sedangkan unsur ekstrinsik berasal dari luar cerita.", "soal": [{"level": "L1", "tanya": "Laporan hasil pengamatan harus ditulis berdasarkan ....", "opsi": ["khayalan penulis", "pendapat tanpa data", "cerita rakyat", "fakta hasil pengamatan"], "kunci": 3, "bahas": "Laporan hasil pengamatan disusun berdasarkan fakta yang diperoleh dari pengamatan."}, {"level": "L1", "tanya": "Struktur teks eksplanasi yang benar adalah ....", "opsi": ["orientasi, komplikasi, resolusi", "tesis, argumentasi, penegasan ulang", "abstrak, orientasi, krisis, reaksi", "pernyataan umum, deret penjelas, interpretasi"], "kunci": 3, "bahas": "Teks eksplanasi terdiri atas pernyataan umum, deret penjelas, dan interpretasi."}, {"level": "L1", "tanya": "Unsur intrinsik cerpen yang menunjukkan tempat dan waktu peristiwa adalah ....", "opsi": ["tema", "alur", "latar", "amanat"], "kunci": 2, "bahas": "Latar menunjukkan tempat, waktu, dan suasana dalam cerita."}, {"level": "L2", "tanya": "Bagian surat resmi yang menunjukkan isi utama surat secara singkat disebut ....", "opsi": ["lampiran", "perihal", "salam pembuka", "tembusan"], "kunci": 1, "bahas": "Perihal menunjukkan pokok isi surat resmi."}, {"level": "L2", "tanya": "Kalimat yang tepat untuk laporan hasil pengamatan adalah ....", "opsi": ["Tanaman kacang hijau tumbuh setinggi 5 cm pada hari ketiga.", "Menurut saya, tanaman itu sangat cantik.", "Tanaman itu mungkin akan menjadi pohon besar.", "Saya membayangkan tanaman itu dapat berbicara."], "kunci": 0, "bahas": "Kalimat tersebut menyampaikan fakta hasil pengamatan yang terukur."}, {"level": "L2", "tanya": "Deret penjelas dalam teks eksplanasi berfungsi ....", "opsi": ["menjelaskan proses terjadinya fenomena", "menyampaikan kesimpulan akhir", "memperkenalkan tokoh cerita", "menyampaikan ajakan kepada pembaca"], "kunci": 0, "bahas": "Deret penjelas menguraikan proses sebab-akibat terjadinya fenomena."}, {"level": "L3", "tanya": "Dalam cerpen, tokoh utama selalu menolong temannya dan akhirnya dipercaya menjadi ketua kelas. Amanat cerita tersebut adalah ....", "opsi": ["menolong hanya dilakukan kepada orang kaya", "kepedulian membawa kepercayaan", "menjadi ketua kelas adalah tujuan utama", "teman tidak perlu ditolong"], "kunci": 1, "bahas": "Amanat adalah pesan moral yang disampaikan melalui peristiwa dalam cerita."}, {"level": "L3", "tanya": "Data formulir yang paling tepat diisi pada kolom tempat dan tanggal lahir adalah ....", "opsi": ["Jalan Merdeka Nomor 5", "Islam", "Kediri, 12 Maret 2014", "Siswa"], "kunci": 2, "bahas": "Tempat dan tanggal lahir ditulis dengan nama tempat diikuti tanggal kelahiran."}]}, {"kelas": 6, "mapel": "Fikih", "topik": "Kriteria makanan, minuman, dan binatang halal serta haram", "materi": "Makanan dan minuman halal adalah yang baik, bersih, tidak membahayakan, dan diperoleh dengan cara yang halal. Binatang halal harus disembelih sesuai syariat apabila termasuk binatang yang wajib disembelih. Daging babi, bangkai, darah, dan minuman memabukkan termasuk yang diharamkan. Jangan tertukar: makanan yang zatnya halal dapat menjadi haram apabila diperoleh melalui cara yang haram, misalnya mencuri.", "soal": [{"level": "L1", "tanya": "Makanan yang diharamkan dalam Islam adalah ....", "opsi": ["daging ayam", "daging sapi", "ikan", "daging babi"], "kunci": 3, "bahas": "Daging babi termasuk makanan yang diharamkan dalam Islam."}, {"level": "L1", "tanya": "Minuman yang memabukkan hukumnya ....", "opsi": ["halal", "makruh", "sunah", "haram"], "kunci": 3, "bahas": "Minuman memabukkan atau khamr hukumnya haram."}, {"level": "L1", "tanya": "Bangkai yang dihalalkan menurut hadis adalah ....", "opsi": ["ayam dan bebek", "sapi dan kambing", "ikan dan belalang", "burung dan kelinci"], "kunci": 2, "bahas": "Hadis menyebutkan dua bangkai yang dihalalkan adalah ikan dan belalang."}, {"level": "L2", "tanya": "Ayam yang disembelih dengan menyebut nama Allah dan mengalirkan darahnya hukum dagingnya ....", "opsi": ["haram", "halal", "makruh", "syubhat"], "kunci": 1, "bahas": "Ayam yang disembelih sesuai syariat halal dikonsumsi."}, {"level": "L2", "tanya": "Seseorang mengambil makanan milik temannya tanpa izin lalu memakannya. Makanan tersebut haram karena ....", "opsi": ["diperoleh dengan cara haram", "zatnya haram", "dimakan pada siang hari", "tidak dimasak sendiri"], "kunci": 0, "bahas": "Makanan yang diperoleh dengan cara haram tidak boleh dikonsumsi."}, {"level": "L2", "tanya": "Kriteria makanan halal adalah ....", "opsi": ["baik, bersih, dan tidak membahayakan", "mahal dan langka", "selalu berasal dari luar negeri", "berwarna menarik"], "kunci": 0, "bahas": "Makanan halal harus baik, bersih, aman, dan diperoleh secara halal."}, {"level": "L3", "tanya": "Seorang siswa ditawari minuman yang tidak jelas kandungannya dan membuatnya pusing serta kehilangan kesadaran. Sikap yang tepat adalah ....", "opsi": ["meminumnya sedikit", "menolak karena minuman memabukkan haram", "membagikannya kepada teman", "menyimpannya untuk diminum nanti"], "kunci": 1, "bahas": "Minuman yang memabukkan dan menghilangkan kesadaran termasuk khamr yang haram."}, {"level": "L3", "tanya": "Perbedaan binatang halal dan haram yang tepat adalah ....", "opsi": ["binatang halal selalu berkaki empat", "binatang haram selalu hidup di air", "binatang halal tidak dilarang syariat dan disembelih sesuai aturan bila wajib disembelih", "binatang haram boleh dimakan apabila dimasak lama"], "kunci": 2, "bahas": "Binatang halal adalah yang tidak dilarang syariat dan memenuhi ketentuan penyembelihan apabila wajib disembelih."}]}, {"kelas": 6, "mapel": "IPAS", "topik": "Rangka, sendi, otot manusia, perjuangan kemerdekaan Indonesia, geografis benua, dan globalisasi", "materi": "Rangka berfungsi menopang tubuh, melindungi organ penting, dan menjadi tempat melekatnya otot. Sendi memungkinkan tulang bergerak, sedangkan otot berkontraksi dan berelaksasi untuk menghasilkan gerakan. Perjuangan kemerdekaan Indonesia mencapai puncaknya dengan Proklamasi 17 Agustus 1945. Jangan tertukar: sendi engsel bergerak satu arah, sedangkan sendi peluru dapat bergerak ke berbagai arah.", "soal": [{"level": "L1", "tanya": "Fungsi utama rangka manusia adalah ....", "opsi": ["menghasilkan bunyi", "menopang tubuh dan melindungi organ penting", "mengatur suhu tubuh", "menghasilkan makanan"], "kunci": 1, "bahas": "Rangka menopang tubuh, melindungi organ penting, dan membantu pergerakan."}, {"level": "L1", "tanya": "Sendi yang terdapat pada siku dan lutut adalah sendi ....", "opsi": ["peluru", "putar", "engsel", "geser"], "kunci": 2, "bahas": "Siku dan lutut menggunakan sendi engsel yang bergerak satu arah."}, {"level": "L1", "tanya": "Proklamasi Kemerdekaan Indonesia dibacakan pada tanggal ....", "opsi": ["1 Juni 1945", "22 Juni 1945", "18 Agustus 1945", "17 Agustus 1945"], "kunci": 3, "bahas": "Proklamasi Kemerdekaan Indonesia dibacakan pada 17 Agustus 1945."}, {"level": "L2", "tanya": "Otot yang bekerja tanpa kesadaran manusia adalah otot ....", "opsi": ["lengan", "kaki", "leher", "jantung"], "kunci": 3, "bahas": "Otot jantung bekerja secara tidak sadar untuk memompa darah."}, {"level": "L2", "tanya": "Benua terbesar di dunia adalah ....", "opsi": ["Afrika", "Eropa", "Asia", "Amerika"], "kunci": 2, "bahas": "Asia merupakan benua terbesar di dunia."}, {"level": "L2", "tanya": "Dampak positif globalisasi bagi siswa adalah ....", "opsi": ["semua budaya lokal harus ditinggalkan", "mudah memperoleh informasi dari berbagai negara", "siswa tidak perlu belajar", "perdagangan antarnegara berhenti"], "kunci": 1, "bahas": "Globalisasi memudahkan pertukaran informasi dan pengetahuan antarnegara."}, {"level": "L3", "tanya": "Seorang siswa dapat memutar lengannya ke berbagai arah pada bahu. Sendi yang bekerja adalah sendi ....", "opsi": ["peluru", "engsel", "putar", "geser"], "kunci": 0, "bahas": "Sendi peluru pada bahu memungkinkan gerakan ke berbagai arah."}, {"level": "L3", "tanya": "Peristiwa Rengasdengklok berkaitan dengan ....", "opsi": ["desakan golongan muda agar proklamasi segera dilaksanakan", "penyusunan Piagam Jakarta", "pengesahan Undang-Undang Dasar 1945", "pembentukan BPUPKI"], "kunci": 0, "bahas": "Golongan muda membawa Soekarno dan Hatta ke Rengasdengklok untuk mendesak proklamasi segera dilaksanakan."}]}, {"kelas": 6, "mapel": "Matematika", "topik": "Operasi pecahan dan desimal lanjutan, rasio, perbandingan, kubus, dan balok", "materi": "Operasi pecahan dan desimal dilakukan dengan memperhatikan nilai tempat serta menyamakan penyebut apabila diperlukan. Rasio membandingkan dua besaran dengan satuan yang sama dan dapat disederhanakan. Kubus memiliki enam sisi persegi yang sama, sedangkan balok memiliki sisi berbentuk persegi panjang. Jangan tertukar: volume mengukur isi bangun ruang, sedangkan luas permukaan mengukur jumlah luas seluruh sisi.", "soal": [{"level": "L1", "tanya": "Hasil dari 3/4 + 0,25 adalah ....", "opsi": ["1", "0,5", "0,75", "1,25"], "kunci": 0, "bahas": "3/4 sama dengan 0,75 sehingga 0,75 ditambah 0,25 sama dengan 1."}, {"level": "L1", "tanya": "Bentuk desimal dari 7/20 adalah ....", "opsi": ["0,7", "0,35", "1,4", "3,5"], "kunci": 1, "bahas": "7 dibagi 20 sama dengan 0,35."}, {"level": "L1", "tanya": "Volume kubus dengan rusuk 5 cm adalah ....", "opsi": ["25 cm3", "75 cm3", "125 cm3", "100 cm3"], "kunci": 2, "bahas": "Volume kubus adalah 5 x 5 x 5 = 125 cm3."}, {"level": "L2", "tanya": "Rasio jumlah siswa laki-laki dan perempuan adalah 3 : 5. Jika jumlah siswa perempuan 25 orang, jumlah siswa laki-laki adalah ....", "opsi": ["10 orang", "20 orang", "30 orang", "15 orang"], "kunci": 3, "bahas": "Setiap bagian bernilai 5 orang sehingga siswa laki-laki berjumlah 3 x 5 = 15 orang."}, {"level": "L2", "tanya": "Hasil dari 2,4 x 0,5 adalah ....", "opsi": ["0,12", "2,9", "12", "1,2"], "kunci": 3, "bahas": "2,4 dikali 0,5 sama dengan setengah dari 2,4, yaitu 1,2."}, {"level": "L2", "tanya": "Volume balok berukuran 8 cm x 5 cm x 4 cm adalah ....", "opsi": ["80 cm3", "120 cm3", "160 cm3", "200 cm3"], "kunci": 2, "bahas": "Volume balok adalah 8 x 5 x 4 = 160 cm3."}, {"level": "L3", "tanya": "Perbandingan uang Ani dan Budi adalah 4 : 7. Jumlah uang mereka Rp110.000,00. Uang Budi adalah ....", "opsi": ["Rp40.000,00", "Rp70.000,00", "Rp60.000,00", "Rp77.000,00"], "kunci": 1, "bahas": "Jumlah bagian adalah 11 sehingga satu bagian bernilai Rp10.000,00 dan uang Budi adalah 7 x Rp10.000,00 = Rp70.000,00."}, {"level": "L3", "tanya": "Luas permukaan kubus dengan rusuk 6 cm adalah ....", "opsi": ["216 cm2", "36 cm2", "108 cm2", "432 cm2"], "kunci": 0, "bahas": "Luas permukaan kubus adalah 6 x 6 x 6 = 216 cm2."}]}, {"kelas": 6, "mapel": "Pendidikan Pancasila", "topik": "Keterkaitan antar-sila Pancasila, hak, kewajiban, tanggung jawab, dan musyawarah", "materi": "Kelima sila Pancasila saling berkaitan dan menjiwai satu sama lain dalam kehidupan berbangsa dan bernegara. Warga negara memiliki hak yang harus dihormati, kewajiban yang harus dilaksanakan, dan tanggung jawab atas akibat perbuatannya. Musyawarah dilakukan untuk mencapai mufakat dengan menghargai pendapat orang lain. Jangan tertukar: hak adalah sesuatu yang diterima, sedangkan kewajiban adalah sesuatu yang harus dilakukan.", "soal": [{"level": "L1", "tanya": "Sila pertama Pancasila berbunyi ....", "opsi": ["Kemanusiaan yang adil dan beradab", "Persatuan Indonesia", "Ketuhanan Yang Maha Esa", "Keadilan sosial bagi seluruh rakyat Indonesia"], "kunci": 2, "bahas": "Sila pertama Pancasila adalah Ketuhanan Yang Maha Esa."}, {"level": "L1", "tanya": "Hak setiap warga negara untuk memperoleh pendidikan termasuk hak ....", "opsi": ["politik", "ekonomi", "budaya", "pendidikan"], "kunci": 3, "bahas": "Memperoleh pendidikan merupakan hak warga negara dalam bidang pendidikan."}, {"level": "L1", "tanya": "Kewajiban siswa di sekolah adalah ....", "opsi": ["memperoleh nilai bagus tanpa belajar", "memilih guru sendiri", "tidak mengikuti pelajaran", "menaati tata tertib sekolah"], "kunci": 3, "bahas": "Menaati tata tertib merupakan kewajiban siswa di sekolah."}, {"level": "L2", "tanya": "Musyawarah dilakukan untuk ....", "opsi": ["memenangkan pendapat sendiri", "menghindari tanggung jawab", "mencapai keputusan bersama", "memilih pemimpin tanpa diskusi"], "kunci": 2, "bahas": "Musyawarah bertujuan mencapai mufakat atau keputusan bersama."}, {"level": "L2", "tanya": "Seorang siswa merusak buku perpustakaan lalu menggantinya. Sikap tersebu
