<script>
const DATA=[{"kelas": 1, "mapel": "Akidah Akhlak", "topik": "Syahadat, Rukun Iman, dan Adab", "materi": "Syahadat berarti mengakui Allah sebagai Tuhan dan Nabi Muhammad sebagai utusan Allah. Rukun iman ada enam, dan Allah Ar-Rahman serta Ar-Rahim Maha Pengasih dan Penyayang. Jangan tertukar: rukun iman ada enam, sedangkan rukun Islam ada lima.", "soal": [{"level": "L1", "tanya": "Syahadat pertama berarti tidak ada Tuhan selain ....", "opsi": ["Nabi", "Allah", "Malaikat"], "kunci": 1, "bahas": "Syahadat pertama mengakui bahwa tidak ada Tuhan selain Allah."}, {"level": "L1", "tanya": "Rukun iman ada ....", "opsi": ["lima", "empat", "enam"], "kunci": 2, "bahas": "Rukun iman berjumlah enam."}, {"level": "L1", "tanya": "Ar-Rahman artinya Allah Maha ....", "opsi": ["Pengasih", "Melihat", "Mendengar"], "kunci": 0, "bahas": "Ar-Rahman berarti Allah Maha Pengasih."}, {"level": "L2", "tanya": "Percaya kepada malaikat termasuk rukun iman yang ke ....", "opsi": ["satu", "dua", "tiga"], "kunci": 1, "bahas": "Iman kepada malaikat adalah rukun iman kedua."}, {"level": "L2", "tanya": "Adab berpakaian yang baik adalah memakai pakaian yang ....", "opsi": ["kotor", "robek", "bersih"], "kunci": 2, "bahas": "Pakaian yang bersih adalah adab berpakaian yang baik."}, {"level": "L2", "tanya": "Saat mandi, kita sebaiknya berada di tempat yang ....", "opsi": ["tertutup", "terbuka", "ramai"], "kunci": 0, "bahas": "Mandi di tempat tertutup menjaga aurat dan kesopanan."}, {"level": "L3", "tanya": "Allah Ar-Rahim Maha Penyayang. Contoh meneladani sifat itu adalah ....", "opsi": ["mengejek teman", "menyayangi adik", "marah-marah"], "kunci": 1, "bahas": "Menyayangi adik menunjukkan kasih sayang kepada sesama."}, {"level": "L3", "tanya": "Teman mengejek pakaian kita. Sikap yang baik adalah ....", "opsi": ["membalas mengejek", "memukul teman", "tetap sopan"], "kunci": 2, "bahas": "Tetap sopan adalah akhlak yang baik saat diejek."}]}, {"kelas": 1, "mapel": "Al-Qur'an Hadis", "topik": "Huruf Hijaiyah, Harakat, dan Surat Pendek", "materi": "Huruf hijaiyah adalah huruf untuk membaca Al-Qur'an. Harakat fathah berbunyi a, kasrah berbunyi i, dan dammah berbunyi u. Jangan tertukar: huruf yang mirip dibedakan dari titiknya.", "soal": [{"level": "L1", "tanya": "Huruf pertama hijaiyah adalah ....", "opsi": ["Alif", "Ba", "Ta"], "kunci": 0, "bahas": "Alif adalah huruf pertama dalam urutan huruf hijaiyah."}, {"level": "L1", "tanya": "Harakat yang berbunyi \"a\" adalah ....", "opsi": ["Kasrah", "Fathah", "Dammah"], "kunci": 1, "bahas": "Fathah memberi bunyi a pada huruf hijaiyah."}, {"level": "L1", "tanya": "Surat pertama dalam Al-Qur'an adalah ....", "opsi": ["Al-Ikhlas", "An-Nas", "Al-Fatihah"], "kunci": 2, "bahas": "Al-Fatihah adalah surat pertama dalam Al-Qur'an."}, {"level": "L2", "tanya": "Huruf ba berharakat kasrah dibaca ....", "opsi": ["Bi", "Ba", "Bu"], "kunci": 0, "bahas": "Kasrah memberi bunyi i sehingga ba dibaca bi."}, {"level": "L2", "tanya": "Bacaan \"Qul huwallahu ahad\" ada dalam surat ....", "opsi": ["Al-Falaq", "Al-Ikhlas", "Al-Fatihah"], "kunci": 1, "bahas": "Ayat itu adalah ayat pertama surat Al-Ikhlas."}, {"level": "L2", "tanya": "Surat yang mengajarkan memohon perlindungan kepada Allah dari kejahatan makhluk adalah ....", "opsi": ["Al-Ikhlas", "Al-Fatihah", "Al-Falaq"], "kunci": 2, "bahas": "Surat Al-Falaq mengajarkan memohon perlindungan kepada Allah."}, {"level": "L3", "tanya": "Huruf ba dan ta dapat dibedakan dari ....", "opsi": ["jumlah titiknya", "warnanya", "ukurannya"], "kunci": 0, "bahas": "Ba mempunyai satu titik di bawah dan ta mempunyai dua titik di atas."}, {"level": "L3", "tanya": "Rangkaian huruf ba berharakat fathah dan sin berharakat kasrah dibaca ....", "opsi": ["Bisu", "Basi", "Basu"], "kunci": 1, "bahas": "Ba berharakat fathah dibaca ba dan sin berharakat kasrah dibaca si."}]}, {"kelas": 1, "mapel": "Bahasa Arab", "topik": "Perkenalan, Keluarga, dan Hobi", "materi": "Dalam perkenalan kita memakai kata ana untuk saya dan menanyakan nama dengan ma ismuka. Kata abi berarti ayahku dan ummi berarti ibuku. Jangan tertukar: hadza untuk laki-laki dan hadzihi untuk perempuan.", "soal": [{"level": "L1", "tanya": "Kata \"ana\" artinya ....", "opsi": ["saya", "kamu", "dia"], "kunci": 0, "bahas": "Ana berarti saya."}, {"level": "L1", "tanya": "Kata \"ummi\" artinya ....", "opsi": ["ayahku", "ibuku", "kakakku"], "kunci": 1, "bahas": "Ummi berarti ibuku."}, {"level": "L1", "tanya": "Kata \"abi\" artinya ....", "opsi": ["ibuku", "adikku", "ayahku"], "kunci": 2, "bahas": "Abi berarti ayahku."}, {"level": "L2", "tanya": "\"Hadza akhi\" artinya ....", "opsi": ["Ini saudara laki-lakiku", "Ini ibuku", "Ini guruku"], "kunci": 0, "bahas": "Akhi berarti saudara laki-lakiku."}, {"level": "L2", "tanya": "\"Uhibbu al-qira'ah\" artinya ....", "opsi": ["Aku suka tidur", "Aku suka membaca", "Aku suka berlari"], "kunci": 1, "bahas": "Al-qira'ah berarti membaca."}, {"level": "L2", "tanya": "\"Man anta?\" artinya ....", "opsi": ["Di mana kamu?", "Apa kabar?", "Siapa kamu?"], "kunci": 2, "bahas": "Man anta berarti siapa kamu."}, {"level": "L3", "tanya": "Guru bertanya, \"Ma ismuka?\" Jawaban yang tepat adalah ....", "opsi": ["Ismi Ahmad", "Ana bikhair", "Hadza kitab"], "kunci": 0, "bahas": "Ismi Ahmad berarti namaku Ahmad."}, {"level": "L3", "tanya": "\"Hadzihi ukhti\" artinya ....", "opsi": ["Ini saudara laki-lakiku", "Ini saudara perempuanku", "Ini ayahku"], "kunci": 1, "bahas": "Ukhti berarti saudara perempuanku."}]}, {"kelas": 1, "mapel": "Bahasa Indonesia", "topik": "Abjad, Suku Kata, dan Cerita Pendek", "materi": "Abjad adalah huruf-huruf untuk membaca dan menulis. Suku kata digabung menjadi kata, misalnya ba dan ca menjadi baca. Jangan tertukar: huruf adalah bunyi terkecil, sedangkan suku kata adalah gabungan huruf.", "soal": [{"level": "L1", "tanya": "Huruf pertama abjad adalah ....", "opsi": ["B", "C", "A"], "kunci": 2, "bahas": "Abjad dimulai dengan huruf A."}, {"level": "L1", "tanya": "Kata \"bola\" diawali huruf ....", "opsi": ["B", "D", "M"], "kunci": 0, "bahas": "Kata bola diawali huruf B."}, {"level": "L1", "tanya": "Suku kata \"ba\" dan \"ca\" jika digabung menjadi ....", "opsi": ["caba", "baca", "baba"], "kunci": 1, "bahas": "Ba dan ca digabung menjadi baca."}, {"level": "L2", "tanya": "Suku kata pertama pada kata \"makan\" adalah ....", "opsi": ["kan", "ka", "ma"], "kunci": 2, "bahas": "Kata makan terdiri dari suku kata ma dan kan."}, {"level": "L2", "tanya": "Kalimat: \"Ibu memasak nasi.\" Yang memasak nasi adalah ....", "opsi": ["Ibu", "nasi", "dapur"], "kunci": 0, "bahas": "Ibu adalah orang yang memasak nasi."}, {"level": "L2", "tanya": "Kata yang diawali huruf S adalah ....", "opsi": ["bola", "susu", "meja"], "kunci": 1, "bahas": "Kata susu diawali huruf S."}, {"level": "L3", "tanya": "Huruf sesudah huruf C adalah ....", "opsi": ["B", "A", "D"], "kunci": 2, "bahas": "Urutan abjad sesudah C adalah D."}, {"level": "L3", "tanya": "Cerita: \"Kiki memberi makan kucing.\" Kiki sedang ....", "opsi": ["memberi makan kucing", "bermain bola", "membaca buku"], "kunci": 0, "bahas": "Cerita menyebut Kiki memberi makan kucing."}]}, {"kelas": 1, "mapel": "Fikih", "topik": "Rukun Islam dan Bersuci", "materi": "Rukun Islam ada lima dan diawali syahadat. Thaharah berarti bersuci, termasuk beristinja setelah buang air. Jangan tertukar: bersuci bukan hanya terlihat bersih, tetapi juga harus suci.", "soal": [{"level": "L1", "tanya": "Rukun Islam yang pertama adalah ....", "opsi": ["salat", "puasa", "syahadat"], "kunci": 2, "bahas": "Rukun Islam pertama adalah mengucapkan syahadat."}, {"level": "L1", "tanya": "Rukun Islam ada ....", "opsi": ["lima", "enam", "tiga"], "kunci": 0, "bahas": "Rukun Islam berjumlah lima."}, {"level": "L1", "tanya": "Thaharah artinya ....", "opsi": ["berdoa", "bersuci", "berlari"], "kunci": 1, "bahas": "Thaharah berarti bersuci dari hadas dan najis."}, {"level": "L2", "tanya": "Setelah buang air kecil, kita membersihkan diri dengan ....", "opsi": ["air kotor", "tidak dibersihkan", "air bersih"], "kunci": 2, "bahas": "Istinja dilakukan untuk membersihkan diri setelah buang air."}, {"level": "L2", "tanya": "Pakaian untuk salat harus ....", "opsi": ["suci dan bersih", "kotor", "basah kotor"], "kunci": 0, "bahas": "Pakaian salat harus suci dan bersih dari najis."}, {"level": "L2", "tanya": "Air yang baik untuk bersuci adalah ....", "opsi": ["air berlumpur", "air bersih", "air bercampur sampah"], "kunci": 1, "bahas": "Air bersih dapat dipakai untuk bersuci."}, {"level": "L3", "tanya": "Tangan kita kotor sebelum makan. Kita harus ....", "opsi": ["langsung makan", "mengelap ke baju", "mencuci tangan"], "kunci": 2, "bahas": "Mencuci tangan menjaga kebersihan sebelum makan."}, {"level": "L3", "tanya": "Sesudah dari toilet, urutan yang benar adalah ....", "opsi": ["beristinja lalu mencuci tangan", "mencuci tangan lalu beristinja", "langsung makan"], "kunci": 0, "bahas": "Setelah buang air kita beristinja lalu mencuci tangan."}]}, {"kelas": 1, "mapel": "Matematika", "topik": "Bilangan 1-20, Tambah-Kurang, dan Bangun Datar", "materi": "Bilangan 1 sampai 20 dapat diurutkan dari kecil ke besar. Penjumlahan menambah dan pengurangan mengurangi. Jangan tertukar: segitiga mempunyai tiga sisi, sedangkan lingkaran tidak mempunyai sisi lurus.", "soal": [{"level": "L1", "tanya": "Bilangan sesudah 7 adalah ....", "opsi": ["8", "6", "9"], "kunci": 0, "bahas": "Sesudah 7 adalah 8."}, {"level": "L1", "tanya": "Hasil 3 + 2 adalah ....", "opsi": ["4", "5", "6"], "kunci": 1, "bahas": "Tiga ditambah dua sama dengan lima."}, {"level": "L1", "tanya": "Bangun segitiga mempunyai sisi sebanyak ....", "opsi": ["4", "0", "3"], "kunci": 2, "bahas": "Segitiga mempunyai tiga sisi."}, {"level": "L2", "tanya": "Hasil 6 + 4 adalah ....", "opsi": ["10", "9", "11"], "kunci": 0, "bahas": "Enam ditambah empat sama dengan sepuluh."}, {"level": "L2", "tanya": "Hasil 9 - 3 adalah ....", "opsi": ["5", "6", "7"], "kunci": 1, "bahas": "Sembilan dikurangi tiga sama dengan enam."}, {"level": "L2", "tanya": "Benda yang berbentuk lingkaran adalah ....", "opsi": ["buku", "pintu", "roda"], "kunci": 2, "bahas": "Roda berbentuk lingkaran."}, {"level": "L3", "tanya": "Hasil 8 + 5 adalah ....", "opsi": ["13", "12", "14"], "kunci": 0, "bahas": "Delapan ditambah lima sama dengan tiga belas."}, {"level": "L3", "tanya": "Siti mempunyai 12 pensil. Ia memberi 4 pensil kepada adik. Pensil Siti sekarang ....", "opsi": ["7", "8", "9"], "kunci": 1, "bahas": "Dua belas dikurangi empat sama dengan delapan."}]}, {"kelas": 1, "mapel": "Pendidikan Pancasila", "topik": "Simbol Pancasila dan Aturan di Rumah", "materi": "Pancasila mempunyai lima sila dengan simbol pada Garuda. Aturan di rumah membantu kita hidup tertib dan rukun. Jangan tertukar: bintang simbol sila pertama, sedangkan padi dan kapas simbol sila kelima.", "soal": [{"level": "L1", "tanya": "Simbol sila pertama adalah ....", "opsi": ["rantai", "bintang", "pohon beringin"], "kunci": 1, "bahas": "Bintang adalah simbol sila pertama."}, {"level": "L1", "tanya": "Simbol sila kedua adalah ....", "opsi": ["bintang", "padi dan kapas", "rantai"], "kunci": 2, "bahas": "Rantai adalah simbol sila kedua."}, {"level": "L1", "tanya": "Simbol sila kelima adalah ....", "opsi": ["padi dan kapas", "kepala banteng", "pohon beringin"], "kunci": 0, "bahas": "Padi dan kapas adalah simbol sila kelima."}, {"level": "L2", "tanya": "Berdoa sebelum makan sesuai dengan sila ....", "opsi": ["kedua", "pertama", "ketiga"], "kunci": 1, "bahas": "Berdoa menunjukkan Ketuhanan Yang Maha Esa."}, {"level": "L2", "tanya": "Aturan di rumah yang baik adalah ....", "opsi": ["membuang sampah sembarangan", "berteriak saat malam", "merapikan mainan"], "kunci": 2, "bahas": "Merapikan mainan membuat rumah tertib."}, {"level": "L2", "tanya": "Menolong adik yang jatuh menunjukkan sikap ....", "opsi": ["peduli", "sombong", "malas"], "kunci": 0, "bahas": "Menolong orang lain menunjukkan sikap peduli."}, {"level": "L3", "tanya": "Teman berbeda agama sedang berdoa. Sikap kita adalah ....", "opsi": ["mengejek", "menghormati", "mengganggu"], "kunci": 1, "bahas": "Menghormati teman yang berdoa adalah sikap yang baik."}, {"level": "L3", "tanya": "Adik ingin memakai mainan yang sama. Sikap yang baik adalah ....", "opsi": ["merebut", "menyembunyikan mainan", "bergantian"], "kunci": 2, "bahas": "Bergantian membuat bermain tetap rukun."}]}, {"kelas": 2, "mapel": "Akidah Akhlak", "topik": "Ta'awudz, Asmaul Husna, dan Nabi Nuh", "materi": "Ta'awudz adalah memohon perlindungan kepada Allah dari setan. Allah Al-Hafizh Maha Menjaga dan Al-Wali Maha Melindungi. Jangan tertukar: rendah hati bukan berarti malu berbuat baik, tetapi tidak sombong.", "soal": [{"level": "L1", "tanya": "Kalimat ta'awudz dibaca untuk memohon perlindungan kepada Allah dari ....", "opsi": ["hujan", "lapar", "setan"], "kunci": 2, "bahas": "Ta'awudz memohon perlindungan Allah dari setan."}, {"level": "L1", "tanya": "Al-Hafizh artinya Allah Maha ....", "opsi": ["Menjaga", "Mendengar", "Melihat"], "kunci": 0, "bahas": "Al-Hafizh berarti Allah Maha Menjaga."}, {"level": "L1", "tanya": "Al-Wali artinya Allah Maha ....", "opsi": ["Menghidupkan", "Melindungi", "Mengampuni"], "kunci": 1, "bahas": "Al-Wali berarti Allah Maha Melindungi."}, {"level": "L2", "tanya": "Sikap rendah hati berarti ....", "opsi": ["suka pamer", "meremehkan teman", "tidak sombong"], "kunci": 2, "bahas": "Rendah hati berarti tidak sombong."}, {"level": "L2", "tanya": "Nabi Nuh a.s. membuat ....", "opsi": ["bahtera", "istana", "menara"], "kunci": 0, "bahas": "Nabi Nuh a.s. membuat bahtera atas perintah Allah."}, {"level": "L2", "tanya": "Sebelum membaca Al-Qur'an, kita membaca ....", "opsi": ["takbir", "ta'awudz", "salam"], "kunci": 1, "bahas": "Ta'awudz dibaca sebelum membaca Al-Qur'an."}, {"level": "L3", "tanya": "Dina mendapat nilai bagus tetapi tidak pamer. Dina bersikap ....", "opsi": ["sombong", "iri", "rendah hati"], "kunci": 2, "bahas": "Tidak pamer menunjukkan sikap rendah hati."}, {"level": "L3", "tanya": "Nabi Nuh a.s. tetap berdakwah walaupun banyak orang menolak. Sikap Nabi Nuh adalah ....", "opsi": ["sabar", "mudah menyerah", "marah-marah"], "kunci": 0, "bahas": "Nabi Nuh a.s. sabar dalam berdakwah."}]}, {"kelas": 2, "mapel": "Al-Qur'an Hadis", "topik": "Surat Pendek, Gunnah, dan Belajar Al-Qur'an", "materi": "Surat Al-Fil, Al-Humazah, Al-Ashr, dan At-Takatsur mengajarkan agar kita beriman dan tidak sombong. Gunnah adalah bunyi dengung saat membaca Al-Qur'an. Jangan tertukar: Al-Ashr berarti masa, sedangkan Al-Fil berarti gajah.", "soal": [{"level": "L1", "tanya": "QS Al-Fil bercerita tentang pasukan ....", "opsi": ["berkuda", "bergajah", "berunta"], "kunci": 1, "bahas": "Al-Fil bercerita tentang pasukan bergajah."}, {"level": "L1", "tanya": "QS Al-Ashr artinya ....", "opsi": ["gajah", "manusia", "masa"], "kunci": 2, "bahas": "Al-Ashr berarti masa atau waktu."}, {"level": "L1", "tanya": "Gunnah adalah bunyi ....", "opsi": ["dengung", "panjang", "jelas"], "kunci": 0, "bahas": "Gunnah adalah bunyi dengung dari hidung."}, {"level": "L2", "tanya": "Orang yang suka mencela dan mengumpat diperingatkan dalam surat ....", "opsi": ["Al-Fil", "Al-Humazah", "Al-Ashr"], "kunci": 1, "bahas": "Al-Humazah memperingatkan pencela dan pengumpat."}, {"level": "L2", "tanya": "Menurut QS Al-Ashr, manusia tidak rugi jika beriman dan ....", "opsi": ["bermalas-malasan", "suka pamer", "beramal saleh"], "kunci": 2, "bahas": "Al-Ashr menyebut iman dan amal saleh sebagai jalan selamat."}, {"level": "L2", "tanya": "Sebaik-baik orang adalah yang belajar Al-Qur'an dan ....", "opsi": ["mengajarkannya", "menyimpannya saja", "melupakannya"], "kunci": 0, "bahas": "Hadis menyebut orang terbaik belajar dan mengajarkan Al-Qur'an."}, {"level": "L3", "tanya": "Rudi pamer banyak mainan dan merasa paling hebat. Surat yang mengingatkan agar tidak bermegah-megahan adalah ....", "opsi": ["Al-Fil", "At-Takatsur", "Al-Humazah"], "kunci": 1, "bahas": "At-Takatsur mengingatkan bahaya bermegah-megahan."}, {"level": "L3", "tanya": "Bunyi dengung terdengar pada kata \"inna\" karena ada huruf nun yang ....", "opsi": ["berharakat fathah", "di akhir kata", "bertasydid"], "kunci": 2, "bahas": "Nun bertasydid dibaca dengan dengung."}]}, {"kelas": 2, "mapel": "Bahasa Arab", "topik": "Warga dan Peralatan Sekolah", "materi": "Kosakata sekolah membantu kita menyebut guru, siswa, buku, tas, dan pena dalam bahasa Arab. Kata hadza dipakai untuk benda laki-laki dan hadzihi untuk benda perempuan. Jangan tertukar: mudarris adalah guru laki-laki dan mudarrisah guru perempuan.", "soal": [{"level": "L1", "tanya": "\"Mudarrisah\" artinya ....", "opsi": ["guru laki-laki", "guru perempuan", "siswa"], "kunci": 1, "bahas": "Mudarrisah berarti guru perempuan."}, {"level": "L1", "tanya": "\"Kitab\" artinya ....", "opsi": ["tas", "kursi", "buku"], "kunci": 2, "bahas": "Kitab berarti buku."}, {"level": "L1", "tanya": "\"Haqiqah\" artinya ....", "opsi": ["tas", "pensil", "meja"], "kunci": 0, "bahas": "Haqiqah berarti tas."}, {"level": "L2", "tanya": "\"Hadza qalam\" artinya ....", "opsi": ["Ini tas", "Ini pena", "Ini buku"], "kunci": 1, "bahas": "Qalam berarti pena."}, {"level": "L2", "tanya": "\"Hadzihi haqiqah\" artinya ....", "opsi": ["Ini pena", "Ini kursi", "Ini tas"], "kunci": 2, "bahas": "Haqiqah berarti tas."}, {"level": "L2", "tanya": "\"Aina al-kitab?\" artinya ....", "opsi": ["Di mana buku itu?", "Siapa guru itu?", "Apa ini?"], "kunci": 0, "bahas": "Aina berarti di mana."}, {"level": "L3", "tanya": "Guru bertanya, \"Ma hadza?\" sambil memegang buku. Jawaban tepat adalah ....", "opsi": ["Hadzihi haqiqah", "Hadza kitab", "Ana tilmidz"], "kunci": 1, "bahas": "Hadza kitab berarti ini buku."}, {"level": "L3", "tanya": "Kata tunjuk yang tepat untuk \"haqiqah\" (tas) adalah ....", "opsi": ["hadza", "ana", "hadzihi"], "kunci": 2, "bahas": "Haqiqah adalah kata perempuan sehingga memakai hadzihi."}]}, {"kelas": 2, "mapel": "Bahasa Indonesia", "topik": "Perasaan, Kesehatan, dan Grafik Gambar", "materi": "Perasaan dapat berupa senang, sedih, takut, atau marah. Badan sehat dijaga dengan makanan bergizi, cuci tangan, dan istirahat cukup. Jangan tertukar: pada grafik gambar, satu gambar dapat mewakili lebih dari satu anak.", "soal": [{"level": "L1", "tanya": "Perasaan gembira disebut ....", "opsi": ["senang", "sedih", "takut"], "kunci": 0, "bahas": "Gembira berarti senang."}, {"level": "L1", "tanya": "Kebiasaan yang membuat badan sehat adalah ....", "opsi": ["jajan sembarangan", "mencuci tangan", "tidur larut malam"], "kunci": 1, "bahas": "Mencuci tangan menjaga badan tetap sehat."}, {"level": "L1", "tanya": "Rani menangis karena mainannya hilang. Perasaan Rani adalah ....", "opsi": ["senang", "marah", "sedih"], "kunci": 2, "bahas": "Menangis karena kehilangan menunjukkan perasaan sedih."}, {"level": "L2", "tanya": "Grafik gambar: 1 gambar apel berarti 2 anak. Ada 3 gambar apel. Banyak anak adalah ....", "opsi": ["6", "3", "5"], "kunci": 0, "bahas": "Tiga gambar dikali dua anak sama dengan enam anak."}, {"level": "L2", "tanya": "Makanan yang baik untuk kesehatan adalah ....", "opsi": ["permen", "sayur dan buah", "kerupuk"], "kunci": 1, "bahas": "Sayur dan buah baik untuk kesehatan."}, {"level": "L2", "tanya": "\"Dodi senang karena mendapat hadiah.\" Perasaan Dodi adalah ....", "opsi": ["takut", "marah", "senang"], "kunci": 2, "bahas": "Kalimat itu menyebut Dodi senang."}, {"level": "L3", "tanya": "Grafik gambar: 1 gambar bintang berarti 3 anak. Ada 4 gambar bintang. Banyak anak adalah ....", "opsi": ["12", "7", "4"], "kunci": 0, "bahas": "Empat gambar dikali tiga anak sama dengan dua belas anak."}, {"level": "L3", "tanya": "Saat batuk, sikap yang sehat adalah ....", "opsi": ["batuk ke arah teman", "menutup mulut", "membuka mulut lebar-lebar"], "kunci": 1, "bahas": "Menutup mulut saat batuk menjaga kesehatan orang lain."}]}, {"kelas": 2, "mapel": "Fikih", "topik": "Azan, Iqamah, dan Salat Berjamaah", "materi": "Azan memanggil orang untuk salat dan iqamah menandakan salat segera dimulai. Salat berjamaah dipimpin imam dan diikuti makmum. Jangan tertukar: azan adalah panggilan salat, sedangkan iqamah adalah tanda salat dimulai.", "soal": [{"level": "L1", "tanya": "Azan adalah panggilan untuk ....", "opsi": ["salat", "makan", "tidur"], "kunci": 0, "bahas": "Azan memanggil umat Islam untuk salat."}, {"level": "L1", "tanya": "Iqamah menandakan salat akan segera ....", "opsi": ["selesai", "dimulai", "dibatalkan"], "kunci": 1, "bahas": "Iqamah adalah tanda salat segera dimulai."}, {"level": "L1", "tanya": "Orang yang mengumandangkan azan disebut ....", "opsi": ["imam", "makmum", "muazin"], "kunci": 2, "bahas": "Muazin adalah orang yang mengumandangkan azan."}, {"level": "L2", "tanya": "Gerakan salat yang pertama adalah ....", "opsi": ["takbiratul ihram", "rukuk", "sujud"], "kunci": 0, "bahas": "Salat dimulai dengan takbiratul ihram."}, {"level": "L2", "tanya": "Saat rukuk, badan kita ....", "opsi": ["berdiri tegak", "membungkuk", "duduk"], "kunci": 1, "bahas": "Rukuk dilakukan dengan membungkukkan badan."}, {"level": "L2", "tanya": "Dalam salat berjamaah, orang yang mengikuti imam disebut ....", "opsi": ["muazin", "khatib", "makmum"], "kunci": 2, "bahas": "Makmum mengikuti gerakan imam."}, {"level": "L3", "tanya": "Makmum harus bergerak ....", "opsi": ["mengikuti imam", "mendahului imam", "bergerak sendiri"], "kunci": 0, "bahas": "Makmum wajib mengikuti gerakan imam."}, {"level": "L3", "tanya": "Urutan gerakan yang benar adalah ....", "opsi": ["sujud, berdiri, lalu rukuk", "berdiri, rukuk, lalu sujud", "rukuk, sujud, lalu berdiri"], "kunci": 1, "bahas": "Dalam salat, berdiri dan rukuk dilakukan sebelum sujud."}]}, {"kelas": 2, "mapel": "Matematika", "topik": "Bilangan sampai 500 dan Bangun Ruang", "materi": "Bilangan sampai 500 mempunyai nilai ratusan, puluhan, dan satuan. Penjumlahan dan pengurangan bersusun dikerjakan dari satuan. Jangan tertukar: kubus mempunyai sisi datar, sedangkan bola mempunyai permukaan melengkung.", "soal": [{"level": "L1", "tanya": "Bilangan 345, angka 3 menempati nilai ....", "opsi": ["puluhan", "ratusan", "satuan"], "kunci": 1, "bahas": "Angka 3 pada 345 bernilai ratusan."}, {"level": "L1", "tanya": "Hasil 120 + 30 adalah ....", "opsi": ["140", "160", "150"], "kunci": 2, "bahas": "Seratus dua puluh ditambah tiga puluh sama dengan seratus lima puluh."}, {"level": "L1", "tanya": "Benda yang berbentuk bola adalah ....", "opsi": ["bola basket", "buku", "kaleng"], "kunci": 0, "bahas": "Bola basket berbentuk bola."}, {"level": "L2", "tanya": "Hasil 256 + 137 adalah ....", "opsi": ["383", "393", "403"], "kunci": 1, "bahas": "256 ditambah 137 sama dengan 393."}, {"level": "L2", "tanya": "Hasil 402 - 158 adalah ....", "opsi": ["254", "234", "244"], "kunci": 2, "bahas": "402 dikurangi 158 sama dengan 244."}, {"level": "L2", "tanya": "Bangun ruang yang mempunyai 6 sisi sama besar adalah ....", "opsi": ["kubus", "bola", "tabung"], "kunci": 0, "bahas": "Kubus mempunyai enam sisi sama besar."}, {"level": "L3", "tanya": "Bilangan yang lebih besar dari 389 adalah ....", "opsi": ["379", "398", "388"], "kunci": 1, "bahas": "398 lebih besar daripada 389."}, {"level": "L3", "tanya": "Ibu membeli 275 kue. Sebanyak 125 kue dibagikan. Sisa kue Ibu adalah ....", "opsi": ["140", "160", "150"], "kunci": 2, "bahas": "275 dikurangi 125 sama dengan 150."}]}, {"kelas": 2, "mapel": "Matematika (Sem 2)", "topik": "Pecahan Sederhana & Pengukuran Waktu", "materi": "Pendalaman Materi: Pecahan Sederhana Pecahan menyatakan bagian dari keseluruhan yang dibagi sama besar . Pecahan $\\frac{1}{2}$ dibaca setengah , $\\frac{1}{3}$ dibaca sepertiga , dan $\\frac{1}{4}$ dibaca seperempat . Tabel Anti-Miskonsepsi Bentuk Pembagian Status Pecahan Alasan 1 kue dipotong 2 bagian sama besar Termasuk pecahan $\\frac{1}{2}$ Ukuran kedua potongan sama persis 1 kue dipotong 2 bagian (1 besar, 1 kecil) Bukan pecahan $\\frac{1}{2}$ Potongan tidak sama besar Modul Pengayaan Kasus: Ibu memotong 1 loyang bolu menjadi 4 bagian sama besar. Jika 2 potong diberikan kepada adik, sisa bolu ibu senilai dengan pecahan berapa? Kunci: Sisa 2 dari 4 bagian atau senilai dengan $\\frac{1}{2}$ lo", "soal": [{"level": "L1", "tanya": "Sebuah apel dipotong menjadi 4 bagian sama besar. Setiap satu potongan apel bernilai pecahan ....", "opsi": ["1/2", "1/3", "1/4"], "kunci": 2, "bahas": "Satu benda utuh yang dibagi menjadi 4 bagian sama besar menghasilkan nilai seperempat (1/4) per bagian."}, {"level": "L2", "tanya": "Salat Subuh dimulai pukul 04.30. Jarum pendek jam berada di antara angka 4 dan 5, sedangkan jarum panjang menunjuk tepat ke angka ....", "opsi": ["3", "6", "12"], "kunci": 1, "bahas": "Lewat 30 menit berarti jarum panjang telah berputar setengah lingkaran menuju angka 6."}, {"level": "L3", "tanya": "Umar memiliki 8 kelereng. Setengah dari kelereng Umar diberikan kepada adiknya. Banyak kelereng Umar yang tersisa sekarang adalah ....", "opsi": ["2 kelereng", "4 kelereng", "6 kelereng"], "kunci": 1, "bahas": "Setengah (1/2) dari 8 adalah 8 dibagi 2 = 4 kelereng. Sisa kelereng Umar adalah 8 - 4 = 4 kelereng."}]}, {"kelas": 2, "mapel": "Pendidikan Pancasila", "topik": "Nilai Pancasila dan Tata Tertib Sekolah", "materi": "Nilai Pancasila diterapkan dengan berdoa, menolong teman, menjaga persatuan, bermusyawarah, dan bersikap adil. Tata tertib membuat sekolah aman dan nyaman. Jangan tertukar: musyawarah sesuai sila keempat, sedangkan keadilan sosial sesuai sila kelima.", "soal": [{"level": "L1", "tanya": "Berdoa sebelum belajar sesuai sila ....", "opsi": ["kedua", "kelima", "pertama"], "kunci": 2, "bahas": "Berdoa sesuai dengan sila pertama."}, {"level": "L1", "tanya": "Menolong teman yang jatuh sesuai sila ....", "opsi": ["kedua", "pertama", "keempat"], "kunci": 0, "bahas": "Menolong teman sesuai dengan sila kedua."}, {"level": "L1", "tanya": "Musyawarah untuk memilih ketua kelas sesuai sila ....", "opsi": ["ketiga", "keempat", "kelima"], "kunci": 1, "bahas": "Musyawarah sesuai dengan sila keempat."}, {"level": "L2", "tanya": "Tata tertib sekolah yang baik adalah ....", "opsi": ["berlari di kelas", "membuang sampah sembarangan", "datang tepat waktu"], "kunci": 2, "bahas": "Datang tepat waktu adalah tata tertib sekolah."}, {"level": "L2", "tanya": "Berbagi alat tulis secara adil sesuai sila ....", "opsi": ["kelima", "pertama", "kedua"], "kunci": 0, "bahas": "Bersikap adil sesuai dengan sila kelima."}, {"level": "L2", "tanya": "Menjaga persatuan teman di kelas sesuai sila ....", "opsi": ["kedua", "ketiga", "keempat"], "kunci": 1, "bahas": "Menjaga persatuan sesuai dengan sila ketiga."}, {"level": "L3", "tanya": "Teman berbeda pendapat saat kerja kelompok. Sikap yang baik adalah ....", "opsi": ["memaksa", "marah", "bermusyawarah"], "kunci": 2, "bahas": "Musyawarah membantu menyelesaikan perbedaan pendapat."}, {"level": "L3", "tanya": "Saat antre di kantin, kita harus ....", "opsi": ["menunggu giliran", "menyerobot", "mendorong teman"], "kunci": 0, "bahas": "Menunggu giliran adalah sikap tertib saat antre."}]}, {"kelas": 3, "mapel": "Akidah Akhlak", "topik": "Syukur nikmat, Ar-Razzaq, Al-Wahhab, iman kepada malaikat, birrul walidain, dan Nabi Ismail a.s.", "materi": "Syukur nikmat dilakukan dengan hati, lisan, dan perbuatan baik. Ar-Razzaq berarti Allah Maha Pemberi rezeki dan Al-Wahhab berarti Allah Maha Pemberi karunia, sedangkan malaikat adalah makhluk Allah yang selalu taat. Jangan tertukar: malaikat Jibril menyampaikan wahyu, sedangkan malaikat Mikail bertugas mengatur rezeki dan hujan atas izin Allah.", "soal": [{"level": "L1", "tanya": "Ar-Razzaq artinya Allah Maha ...", "opsi": ["Pengampun", "Pemberi rezeki", "Pencipta", "Mengetahui"], "kunci": 1, "bahas": "Ar-Razzaq berarti Allah Maha Pemberi rezeki."}, {"level": "L1", "tanya": "Malaikat yang bertugas menyampaikan wahyu adalah ...", "opsi": ["Israfil", "Malik", "Mikail", "Jibril"], "kunci": 3, "bahas": "Malaikat Jibril bertugas menyampaikan wahyu kepada para nabi dan rasul."}, {"level": "L1", "tanya": "Berbakti kepada kedua orang tua disebut ...", "opsi": ["birrul walidain", "zuhud", "silaturahmi", "tawakal"], "kunci": 0, "bahas": "Birrul walidain berarti berbakti dan berbuat baik kepada kedua orang tua."}, {"level": "L2", "tanya": "Dina mendapat nilai baik lalu mengucapkan alhamdulillah dan membantu temannya belajar. Perilaku Dina menunjukkan syukur dengan ...", "opsi": ["diam saja", "pamer", "lisan dan perbuatan", "mengeluh"], "kunci": 2, "bahas": "Syukur dapat diwujudkan melalui ucapan pujian dan penggunaan nikmat untuk kebaikan."}, {"level": "L2", "tanya": "Ketika hujan turun dan tanaman tumbuh, tugas malaikat yang berkaitan dengan rezeki adalah ...", "opsi": ["Raqib", "Munkar", "Mikail", "Izrail"], "kunci": 2, "bahas": "Malaikat Mikail bertugas mengatur rezeki, termasuk hujan, atas izin Allah."}, {"level": "L2", "tanya": "Contoh birrul walidain di rumah adalah ...", "opsi": ["membantu ibu membersihkan rumah", "mengabaikan nasihat orang tua", "membantah perintah ibu", "berteriak kepada ayah"], "kunci": 0, "bahas": "Membantu orang tua adalah bentuk bakti dan kasih sayang kepada mereka."}, {"level": "L3", "tanya": "Nabi Ismail a.s. menunjukkan ketaatan ketika ...", "opsi": ["menolak perintah Allah", "meminta harta yang banyak", "meninggalkan keluarganya", "bersedia menjalankan perintah Allah yang disampaikan melalui ayahnya"], "kunci": 3, "bahas": "Nabi Ismail a.s. dikenal sabar dan taat terhadap perintah Allah."}, {"level": "L3", "tanya": "Rudi percaya malaikat selalu mencatat amal, sehingga ia jujur walaupun tidak ada guru yang melihat. Sikap Rudi menunjukkan iman kepada ...", "opsi": ["hari akhir", "malaikat", "qada dan qadar", "kitab Allah"], "kunci": 1, "bahas": "Keyakinan bahwa malaikat mencatat amal mendorong Rudi berbuat jujur."}]}, {"kelas": 3, "mapel": "Al-Qur'an Hadis", "topik": "Surah Al-Qadr, Al-'Alaq, At-Tin, Al-Insyirah, mad thabi'i, dan hadis salat berjamaah", "materi": "Surah Al-Qadr menjelaskan kemuliaan malam Lailatulqadar, Al-'Alaq diawali perintah membaca, At-Tin menegaskan manusia diciptakan dalam bentuk terbaik, dan Al-Insyirah mengajarkan kelapangan dada. Mad thabi'i dibaca panjang dua harakat, sedangkan salat berjamaah lebih utama daripada salat sendiri. Jangan tertukar: mad thabi'i panjangnya dua harakat, bukan dibaca sangat panjang.", "soal": [{"level": "L1", "tanya": "Surah Al-Qadr menjelaskan kemuliaan malam ...", "opsi": ["Lailatulqadar", "Isra Mikraj", "Nuzulul Qur'an", "Idulfitri"], "kunci": 0, "bahas": "Al-Qadr menjelaskan bahwa Lailatulqadar lebih baik daripada seribu bulan."}, {"level": "L1", "tanya": "Kata pertama pada Surah Al-'Alaq adalah ...", "opsi": ["Tabarak", "Alhamdu", "Iqra'", "Qul"], "kunci": 2, "bahas": "Surah Al-'Alaq diawali kata iqra' yang berarti bacalah."}, {"level": "L1", "tanya": "Mad thabi'i dibaca sepanjang ...", "opsi": ["lima harakat", "dua harakat", "satu harakat", "tiga harakat"], "kunci": 1, "bahas": "Mad thabi'i dibaca panjang selama dua harakat."}, {"level": "L2", "tanya": "Aisyah membaca kata 'qāla' dengan memanjangkan bunyi a selama dua harakat. Bacaan itu contoh ...", "opsi": ["qalqalah", "idgham", "ikhfa", "mad thabi'i"], "kunci": 3, "bahas": "Alif setelah fathah menimbulkan mad thabi'i yang dibaca dua harakat."}, {"level": "L2", "tanya": "Pesan utama Surah Al-Insyirah adalah Allah melapangkan dada dan ...", "opsi": ["memerintahkan manusia berhenti berusaha", "menghapus semua ujian", "menghilangkan kewajiban salat", "menjadikan setiap kesulitan disertai kemudahan"], "kunci": 3, "bahas": "Al-Insyirah menegaskan bahwa bersama kesulitan ada kemudahan."}, {"level": "L2", "tanya": "Menurut hadis, pahala salat berjamaah dibandingkan salat sendirian adalah ...", "opsi": ["hanya berlaku di rumah", "dua puluh tujuh derajat lebih utama", "sama", "lebih rendah"], "kunci": 1, "bahas": "Hadis menyebutkan salat berjamaah lebih utama dua puluh tujuh derajat daripada salat sendirian."}, {"level": "L3", "tanya": "Rafi membaca 'yā' pada kata 'yā ayyuhā' dengan panjang empat harakat. Perbaikan yang tepat adalah ...", "opsi": ["tetap empat harakat", "dihilangkan", "dipendekkan menjadi dua harakat", "dibaca enam harakat"], "kunci": 2, "bahas": "Ya mad thabi'i dibaca dua harakat sehingga bacaan Rafi perlu dipendekkan."}, {"level": "L3", "tanya": "Siti merasa sedih karena tugasnya sulit, lalu ia berdoa dan tetap berusaha. Sikap Siti sesuai pesan Surah ...", "opsi": ["Al-Insyirah", "At-Tin", "Al-'Alaq", "Al-Qadr"], "kunci": 0, "bahas": "Al-Insyirah mengajarkan harapan dan kemudahan setelah kesulitan."}]}, {"kelas": 3, "mapel": "Bahasa Arab", "topik": "Mata pelajaran, nama-nama hewan, dan nama penyakit", "materi": "Kosakata bahasa Arab semester ini meliputi mata pelajaran, hewan, dan penyakit. Contohnya ar-riyadiyyat berarti matematika, qittun berarti kucing, dan humma berarti demam. Jangan tertukar: asadun berarti singa, sedangkan samakatun berarti ikan.", "soal": [{"level": "L1", "tanya": "Bahasa Arab 'matematika' adalah ...", "opsi": ["ar-riyadiyyat", "al-'ulum", "at-tarikh", "al-fiqh"], "kunci": 0, "bahas": "Ar-riyadiyyat berarti matematika."}, {"level": "L1", "tanya": "Qittun artinya ...", "opsi": ["singa", "ikan", "kucing", "anjing"], "kunci": 2, "bahas": "Qittun berarti kucing."}, {"level": "L1", "tanya": "Humma artinya ...", "opsi": ["pusing", "demam", "batuk", "sakit gigi"], "kunci": 1, "bahas": "Humma berarti demam."}, {"level": "L2", "tanya": "Siti melihat hewan berkaki empat yang menggonggong. Bahasa Arab hewan itu adalah ...", "opsi": ["tayrun", "samakatun", "asadun", "kalbun"], "kunci": 3, "bahas": "Kalbun berarti anjing."}, {"level": "L2", "tanya": "Ketika kepala terasa sakit, keluhan itu disebut ...", "opsi": ["alamus sinn", "humma", "su'al", "suda'"], "kunci": 3, "bahas": "Suda' berarti sakit kepala."}, {"level": "L2", "tanya": "Pelajaran tentang makhluk hidup dan benda alam disebut ...", "opsi": ["at-tarikh", "al-'ulum", "al-lughah al-'arabiyyah", "ar-riyadiyyat"], "kunci": 1, "bahas": "Al-'ulum berarti ilmu pengetahuan atau sains."}, {"level": "L3", "tanya": "Kalimat 'hadza qittun' tepat digunakan untuk menunjuk ...", "opsi": ["ikan jauh", "burung betina", "kucing jantan/dekat", "singa jauh"], "kunci": 2, "bahas": "Hadza digunakan untuk menunjuk benda maskulin yang dekat, seperti qittun."}, {"level": "L3", "tanya": "Umar batuk dan badannya panas. Pasangan kosakata yang tepat adalah ...", "opsi": ["su'al dan humma", "alamus sinn dan asadun", "tayrun dan samakatun", "suda' dan qittun"], "kunci": 0, "bahas": "Su'al berarti batuk dan humma berarti demam."}]}, {"kelas": 3, "mapel": "Bahasa Indonesia", "topik": "Ide pokok paragraf, kalimat efektif, dan teks wawancara", "materi": "Ide pokok adalah gagasan utama yang dibahas dalam paragraf. Kalimat efektif menyampaikan maksud secara jelas, singkat, dan tidak bertele-tele, sedangkan teks wawancara berisi tanya jawab antara pewawancara dan narasumber. Jangan tertukar: ide pokok adalah gagasan utama, sedangkan kalimat penjelas hanya memberi rincian.", "soal": [{"level": "L1", "tanya": "Gagasan utama dalam sebuah paragraf disebut ...", "opsi": ["kalimat penjelas", "judul", "ide pokok", "kesimpulan"], "kunci": 2, "bahas": "Ide pokok adalah gagasan utama yang menjadi inti paragraf."}, {"level": "L1", "tanya": "Kalimat yang jelas dan tidak bertele-tele disebut kalimat ...", "opsi": ["efektif", "perintah", "tanya", "majemuk"], "kunci": 0, "bahas": "Kalimat efektif menyampaikan maksud secara jelas dan ringkas."}, {"level": "L1", "tanya": "Orang yang menjawab pertanyaan dalam wawancara disebut ...", "opsi": ["pembaca", "pewawancara", "penulis", "narasumber"], "kunci": 3, "bahas": "Narasumber adalah orang yang memberikan jawaban dalam wawancara."}, {"level": "L2", "tanya": "Paragraf: 'Kucing adalah hewan peliharaan yang bersih. Ia menjilat bulunya dan buang kotoran di tempat khusus.' Ide pokoknya adalah ...", "opsi": ["kucing suka tidur", "kucing hewan yang bersih", "kucing makan ikan", "kucing berbulu lembut"], "kunci": 1, "bahas": "Kalimat pertama dan penjelasnya menunjukkan kucing adalah hewan yang bersih."}, {"level": "L2", "tanya": "Kalimat yang paling efektif adalah ...", "opsi": ["Belajar siswa sedang para.", "Siswa sedang belajar.", "Siswa-siswa para belajar sedang.", "Para siswa-siswa sedang belajar."], "kunci": 1, "bahas": "Kalimat 'Siswa sedang belajar' jelas dan tidak berlebihan."}, {"level": "L2", "tanya": "Pertanyaan wawancara yang tepat untuk menanyakan alasan adalah ...", "opsi": ["Kapan kamu lahir?", "Siapa namamu?", "Di mana rumahmu?", "Mengapa kamu memilih profesi itu?"], "kunci": 3, "bahas": "Kata tanya mengapa digunakan untuk menanyakan alasan."}, {"level": "L3", "tanya": "Paragraf: 'Budi rajin berolahraga. Ia berlari setiap pagi dan bersepeda pada sore hari. Badannya pun sehat.' Kalimat penjelasnya adalah ...", "opsi": ["Ia berlari setiap pagi dan bersepeda pada sore hari.", "Budi rajin berolahraga.", "Badannya pun sehat.", "Tidak ada kalimat penjelas."], "kunci": 0, "bahas": "Kalimat kedua memberi rincian kegiatan olahraga Budi."}, {"level": "L3", "tanya": "Dalam wawancara, pewawancara sebaiknya ...", "opsi": ["bertanya tanpa tujuan", "mengubah semua jawaban", "menyiapkan pertanyaan dan mendengarkan jawaban", "memotong jawaban narasumber"], "kunci": 2, "bahas": "Pewawancara yang baik menyiapkan pertanyaan dan mendengarkan jawaban dengan sopan."}]}, {"kelas": 3, "mapel": "Fikih", "topik": "Salat sunah rawatib, salat jamak dan qasar, serta keringanan salat bagi orang sakit", "materi": "Salat rawatib adalah salat sunah yang mengiringi salat fardu, baik sebelum maupun sesudahnya. Salat jamak menggabungkan dua salat fardu dalam satu waktu, sedangkan qasar memendekkan salat empat rakaat menjadi dua rakaat bagi musafir yang memenuhi syarat. Jangan tertukar: jamak berkaitan dengan penggabungan waktu, sedangkan qasar berkaitan dengan pengurangan jumlah rakaat.", "soal": [{"level": "L1", "tanya": "Salat sunah yang mengiringi salat fardu disebut salat ...", "opsi": ["tarawih", "witir", "rawatib", "istikharah"], "kunci": 2, "bahas": "Salat rawatib dikerjakan sebelum atau sesudah salat fardu."}, {"level": "L1", "tanya": "Menggabungkan salat Zuhur dan Asar dalam satu waktu disebut salat ...", "opsi": ["jamak", "jumat", "jenazah", "qasar"], "kunci": 0, "bahas": "Jamak berarti menggabungkan dua salat fardu dalam satu waktu."}, {"level": "L1", "tanya": "Qasar adalah memendekkan salat empat rakaat menjadi ...", "opsi": ["lima rakaat", "satu rakaat", "tiga rakaat", "dua rakaat"], "kunci": 3, "bahas": "Qasar memendekkan salat empat rakaat menjadi dua rakaat."}, {"level": "L2", "tanya": "Salat sunah dua rakaat sebelum Subuh termasuk rawatib yang ...", "opsi": ["tidak pernah dianjurkan", "muakkad", "wajib", "dikerjakan sesudah Isya"], "kunci": 1, "bahas": "Dua rakaat sebelum Subuh adalah rawatib muakkad yang sangat dianjurkan."}, {"level": "L2", "tanya": "Seorang musafir mengerjakan Zuhur dan Asar pada waktu Zuhur. Cara itu disebut jamak ...", "opsi": ["qasar", "taqdim", "rawatib", "takhir"], "kunci": 1, "bahas": "Jamak taqdim mengerjakan salat berikutnya pada waktu salat pertama."}, {"level": "L2", "tanya": "Orang sakit yang tidak mampu berdiri boleh salat dengan cara ...", "opsi": ["berdiri paksa sampai pingsan", "meninggalkan salat", "berlari", "duduk atau berbaring sesuai kemampuan"], "kunci": 3, "bahas": "Islam memberi keringanan salat sesuai kemampuan orang yang sakit."}, {"level": "L3", "tanya": "Dalam perjalanan jauh, Fajar mengerjakan Asar dua rakaat pada waktu Zuhur bersama salat Zuhur. Fajar melakukan ...", "opsi": ["jamak taqdim dan qasar", "jamak takhir saja", "rawatib saja", "salat Jumat"], "kunci": 0, "bahas": "Fajar menggabungkan waktu pada Zuhur dan memendekkan Asar menjadi dua rakaat."}, {"level": "L3", "tanya": "Ibu Sari sakit dan air membahayakan lukanya. Keringanan bersuci yang dapat digunakan adalah ...", "opsi": ["mandi besar", "tidak bersuci selamanya", "tayamum", "wudu dengan air panas"], "kunci": 2, "bahas": "Tayamum menjadi pengganti wudu ketika air tidak ada atau membahayakan."}]}, {"kelas": 3, "mapel": "IPAS", "topik": "Ciri dan siklus makhluk hidup, wujud zat dan perubahannya, serta sumber energi", "materi": "Makhluk hidup bernapas, membutuhkan makanan, tumbuh, bergerak, dan berkembang biak. Zat dapat berwujud padat, cair, dan gas serta berubah karena pemanasan atau pendinginan, sedangkan energi berasal antara lain dari matahari, air, angin, makanan, dan bahan bakar. Jangan tertukar: menguap adalah perubahan cair menjadi gas, sedangkan mengembun adalah gas menjadi cair.", "soal": [{"level": "L1", "tanya": "Salah satu ciri makhluk hidup adalah ...", "opsi": ["tumbuh dan berkembang", "tidak membutuhkan makanan", "selalu diam", "tidak bernapas"], "kunci": 0, "bahas": "Makhluk hidup tumbuh dan berkembang."}, {"level": "L1", "tanya": "Es yang dipanaskan akan ...", "opsi": ["mengembun", "menyublim", "mencair", "membeku"], "kunci": 2, "bahas": "Es mencair menjadi air ketika dipanaskan."}, {"level": "L1", "tanya": "Sumber energi utama bagi tumbuhan untuk fotosintesis adalah ...", "opsi": ["tanah", "matahari", "bulan", "batu"], "kunci": 1, "bahas": "Matahari adalah sumber energi utama untuk fotosintesis."}, {"level": "L2", "tanya": "Urutan siklus hidup kupu-kupu yang benar adalah ...", "opsi": ["ulat-telur-kupu-kupu-kepompong", "kepompong-telur-ulat-kupu-kupu", "kupu-kupu-ulat-telur-kepompong", "telur-ulat-kepompong-kupu-kupu"], "kunci": 3, "bahas": "Kupu-kupu bermula dari telur, lalu ulat, kepompong, dan kupu-kupu dewasa."}, {"level": "L2", "tanya": "Air pada tutup panci panas berubah menjadi titik-titik air. Peristiwa itu disebut ...", "opsi": ["membeku", "mencair", "menguap", "mengembun"], "kunci": 3, "bahas": "Uap air yang berubah menjadi titik air mengalami pengembunan."}, {"level": "L2", "tanya": "Kincir dapat berputar karena energi ...", "opsi": ["panas bumi", "angin", "cahaya", "bunyi"], "kunci": 1, "bahas": "Kincir angin bergerak karena energi angin."}, {"level": "L3", "tanya": "Sebuah tanaman diletakkan di tempat gelap dan tidak disiram. Tanaman kemungkinan akan ...", "opsi": ["tumbuh lebih subur", "berubah menjadi batu", "layu dan mati", "menghasilkan oksigen lebih banyak"], "kunci": 2, "bahas": "Tanaman membutuhkan cahaya dan air sehingga akan layu tanpa keduanya."}, {"level": "L3", "tanya": "Baju basah menjadi kering setelah dijemur karena air mengalami ...", "opsi": ["penguapan", "pengembunan", "pencairan", "pembekuan"], "kunci": 0, "bahas": "Panas matahari menyebabkan air pada baju menguap."}]}, {"kelas": 3, "mapel": "Matematika", "topik": "Bilangan cacah sampai 1.000, perkalian dan pembagian, serta pengukuran panjang dan berat", "materi": "Bilangan cacah sampai 1.000 dibaca berdasarkan nilai tempat ratusan, puluhan, dan satuan. Perkalian adalah penjumlahan berulang, pembagian adalah pengurangan berulang atau membagi sama banyak, dan pengukuran menggunakan satuan baku seperti meter, sentimeter, kilogram, dan gram. Jangan tertukar: 1 meter sama dengan 100 sentimeter, bukan 10 sentimeter.", "soal": [{"level": "L1", "tanya": "Nilai tempat angka 7 pada bilangan 472 adalah ...", "opsi": ["satuan", "ratusan", "ribuan", "puluhan"], "kunci": 3, "bahas": "Angka 7 pada 472 menempati tempat puluhan."}, {"level": "L1", "tanya": "Hasil 8 x 6 adalah ...", "opsi": ["54", "48", "56", "42"], "kunci": 1, "bahas": "Delapan dikali enam sama dengan empat puluh delapan."}, {"level": "L1", "tanya": "Satu meter sama dengan ...", "opsi": ["10.000 cm", "10 cm", "100 cm", "1.000 cm"], "kunci": 2, "bahas": "Satu meter sama dengan seratus sentimeter."}, {"level": "L2", "tanya": "Bilangan 609 dibaca ...", "opsi": ["enam ratus sembilan", "enam ratus sembilan puluh", "enam puluh sembilan", "enam ribu sembilan"], "kunci": 0, "bahas": "Bilangan 609 dibaca enam ratus sembilan."}, {"level": "L2", "tanya": "Ibu mempunyai 36 kue yang dibagikan sama banyak kepada 6 anak. Setiap anak menerima ...", "opsi": ["6 kue", "7 kue", "8 kue", "5 kue"], "kunci": 0, "bahas": "Tiga puluh enam dibagi enam sama dengan enam."}, {"level": "L2", "tanya": "Berat 2 kg sama dengan ...", "opsi": ["20.000 gram", "200 gram", "2.000 gram", "20 gram"], "kunci": 2, "bahas": "Satu kilogram sama dengan seribu gram sehingga dua kilogram sama dengan dua ribu gram."}, {"level": "L3", "tanya": "Sebuah pita panjangnya 3 m 25 cm. Panjang pita dalam sentimeter adalah ...", "opsi": ["352 cm", "325 cm", "3.025 cm", "125 cm"], "kunci": 1, "bahas": "Tiga meter sama dengan 300 cm, ditambah 25 cm menjadi 325 cm."}, {"level": "L3", "tanya": "Ada 7 kotak berisi masing-masing 9 pensil. Setelah 13 pensil dipakai, pensil yang tersisa adalah ...", "opsi": ["54", "63", "52", "50"], "kunci": 3, "bahas": "Tujuh kali sembilan sama dengan 63, lalu 63 dikurangi 13 sama dengan 50."}]}, {"kelas": 3, "mapel": "Pendidikan Pancasila", "topik": "Identitas diri dan budaya serta hak dan kewajiban di rumah dan sekolah", "materi": "Identitas diri meliputi nama, keluarga, bahasa, dan budaya yang kita miliki. Di rumah dan sekolah, setiap anak mempunyai hak untuk belajar dan merasa aman, serta kewajiban menaati aturan dan menghormati orang lain. Jangan tertukar: hak adalah sesuatu yang diterima, sedangkan kewajiban adalah sesuatu yang harus dilakukan.", "soal": [{"level": "L1", "tanya": "Contoh identitas diri adalah ...", "opsi": ["warna tas teman", "nama dan bahasa daerah", "jumlah jendela kelas", "letak papan tulis"], "kunci": 1, "bahas": "Nama dan bahasa daerah merupakan bagian dari identitas diri."}, {"level": "L1", "tanya": "Hak anak di sekolah adalah ...", "opsi": ["mengganggu teman", "melanggar tata tertib", "merusak buku", "mendapat pelajaran"], "kunci": 3, "bahas": "Mendapat pelajaran adalah hak setiap anak di sekolah."}, {"level": "L1", "tanya": "Kewajiban siswa di kelas adalah ...", "opsi": ["menaati tata tertib", "memilih teman saja", "bermain saat guru menjelaskan", "meminta hadiah"], "kunci": 0, "bahas": "Menaati tata tertib adalah kewajiban siswa di sekolah."}, {"level": "L2", "tanya": "Rani memakai pakaian adat daerahnya dengan bangga pada acara sekolah. Sikap Rani menunjukkan ...", "opsi": ["menolak budaya", "melanggar aturan", "menghargai identitas budaya", "tidak peduli"], "kunci": 2, "bahas": "Memakai pakaian adat dengan bangga menunjukkan penghargaan terhadap budaya."}, {"level": "L2", "tanya": "Di rumah, kewajiban anak setelah bermain adalah ...", "opsi": ["meminta mainan baru", "menonton televisi", "merapikan mainan", "membiarkan mainan berserakan"], "kunci": 2, "bahas": "Merapikan mainan adalah kewajiban anak setelah bermain."}, {"level": "L2", "tanya": "Hak anak untuk merasa aman berarti anak berhak ...", "opsi": ["dilindungi dari kekerasan", "mengambil barang orang lain", "bebas mengejek teman", "tidak mengikuti pelajaran"], "kunci": 0, "bahas": "Hak merasa aman berarti anak harus dilindungi dari kekerasan."}, {"level": "L3", "tanya": "Dodi ingin memakai perpustakaan, tetapi ia mengembalikan buku tepat waktu dan menjaga ketenangan. Dodi menunjukkan keseimbangan antara ...", "opsi": ["hak dan keinginan", "kewajiban dan hukuman", "budaya dan bahasa", "hak dan kewajiban"], "kunci": 3, "bahas": "Dodi menggunakan hak membaca sambil melaksanakan kewajiban menjaga buku dan ketertiban."}, {"level": "L3", "tanya": "Teman baru berbicara dengan logat berbeda. Sikap yang tepat adalah ...", "opsi": ["menjauhinya", "menghormati dan mengajaknya berteman", "menirunya untuk mengejek", "menertawakannya"], "kunci": 1, "bahas": "Menghormati perbedaan identitas menunjukkan sikap menghargai keberagaman."}]}, {"kelas": 3, "mapel": "SKI", "topik": "Tradisi masyarakat Arab pra-Islam dan masa kecil hingga kerasulan Nabi Muhammad saw.", "materi": "Masyarakat Arab pra-Islam dikenal pandai bersyair dan berdagang, tetapi banyak yang menyembah berhala serta sering bertikai antarsuku. Nabi Muhammad saw. lahir pada Tahun Gajah, diasuh Halimah as-Sa'diyah, lalu dibesarkan oleh kakek dan pamannya. Jangan tertukar: Nabi Muhammad saw. menerima wahyu pertama di Gua Hira pada usia empat puluh tahun, bukan saat masih kanak-kanak.", "soal": [{"level": "L1", "tanya": "Nabi Muhammad saw. lahir pada tahun yang dikenal sebagai Tahun ...", "opsi": ["Hijrah", "Kesedihan", "Kemenangan", "Gajah"], "kunci": 3, "bahas": "Kelahiran Nabi Muhammad saw. terjadi pada Tahun Gajah."}, {"level": "L1", "tanya": "Ibu susuan Nabi Muhammad saw. adalah ...", "opsi": ["Khadijah", "Halimah as-Sa'diyah", "Fatimah", "Aminah"], "kunci": 1, "bahas": "Halimah as-Sa'diyah adalah ibu susuan Nabi Muhammad saw."}, {"level": "L1", "tanya": "Wahyu pertama diterima Nabi Muhammad saw. di ...", "opsi": ["Bukit Safa", "Gua Tsur", "Gua Hira", "Masjid Nabawi"], "kunci": 2, "bahas": "Wahyu pertama turun ketika Nabi Muhammad saw. berada di Gua Hira."}, {"level": "L2", "tanya": "Kebiasaan buruk masyarakat Arab pra-Islam adalah ...", "opsi": ["menyembah berhala", "berdagang", "bersyair", "menjamu tamu"], "kunci": 0, "bahas": "Penyembahan berhala termasuk kebiasaan jahiliah masyarakat Arab pra-Islam."}, {"level": "L2", "tanya": "Setelah kakeknya wafat, Nabi Muhammad saw. diasuh oleh pamannya yang bernama ...", "opsi": ["Abu Talib", "Abbas", "Abu Lahab", "Hamzah"], "kunci": 0, "bahas": "Abu Talib mengasuh Nabi Muhammad saw. setelah Abdul Muttalib wafat."}, {"level": "L2", "tanya": "Gelar Al-Amin diberikan kepada Nabi Muhammad saw. karena beliau ...", "opsi": ["suka bepergian", "sangat kaya", "dapat dipercaya", "paling kuat"], "kunci": 2, "bahas": "Al-Amin berarti orang yang dapat dipercaya."}, {"level": "L3", "tanya": "Urutan pengasuh Nabi Muhammad saw. setelah ibunya wafat adalah ...", "opsi": ["Abu Talib lalu Abdul Muttalib", "Abdul Muttalib lalu Abu Talib", "Halimah lalu Khadijah", "Hamzah lalu Abbas"], "kunci": 1, "bahas": "Setelah Aminah wafat, Nabi diasuh Abdul Muttalib kemudian Abu Talib."}, {"level": "L3", "tanya": "Pada usia empat puluh tahun, peristiwa besar yang dialami Nabi Muhammad saw. adalah ...", "opsi": ["Fathu Makkah", "Isra Mikraj", "hijrah ke Madinah", "menerima wahyu pertama"], "kunci": 3, "bahas": "Nabi Muhammad saw. menerima wahyu pertama pada usia empat puluh tahun."}]}, {"kelas": 4, "mapel": "Akidah Akhlak", "topik": "Kalimat thayyibah, Al-Malik, Al-'Aziz, Al-Quddus, iman kepada kitab Allah, amanah, dan Bilal bin Rabah", "materi": "Subhanallah berarti Mahasuci Allah, Masyaallah berarti atas kehendak Allah, dan Allahu Akbar berarti Allah Mahabesar. Al-Malik berarti Allah Maha Raja, Al-'Aziz Maha Perkasa, dan Al-Quddus Maha Suci, sedangkan amanah berarti dapat dipercaya. Jangan tertukar: Zabur diturunkan kepada Nabi Daud a.s., sedangkan Injil diturunkan kepada Nabi Isa a.s.", "soal": [{"level": "L1", "tanya": "Subhanallah berarti ...", "opsi": ["Allah Mahabesar", "atas kehendak Allah", "Mahasuci Allah", "segala puji bagi Allah"], "kunci": 2, "bahas": "Subhanallah berarti Mahasuci Allah."}, {"level": "L1", "tanya": "Al-Quddus artinya Allah Maha ...", "opsi": ["Suci", "Perkasa", "Pengampun", "Raja"], "kunci": 0, "bahas": "Al-Quddus berarti Allah Maha Suci."}, {"level": "L1", "tanya": "Kitab Taurat diturunkan kepada Nabi ...", "opsi": ["Muhammad saw.", "Daud a.s.", "Isa a.s.", "Musa a.s."], "kunci": 3, "bahas": "Kitab Taurat diturunkan kepada Nabi Musa a.s."}, {"level": "L2", "tanya": "Ketika melihat ciptaan Allah yang indah, kalimat yang tepat diucapkan adalah ...", "opsi": ["Astaghfirullah", "Masyaallah", "Innalillahi", "Bismillah saja"], "kunci": 1, "bahas": "Masyaallah diucapkan untuk mengakui keindahan atau nikmat atas kehendak Allah."}, {"level": "L2", "tanya": "Siti menjaga uang titipan temannya dan mengembalikannya utuh. Siti menunjukkan sikap ...", "opsi": ["pemarah", "amanah", "malas", "sombong"], "kunci": 1, "bahas": "Menjaga titipan dan mengembalikannya menunjukkan amanah."}, {"level": "L2", "tanya": "Bilal bin Rabah dikenal sebagai ...", "opsi": ["paman Nabi", "penulis wahyu pertama", "raja Habasyah", "muazin Nabi Muhammad saw."], "kunci": 3, "bahas": "Bilal bin Rabah adalah muazin Nabi Muhammad saw."}, {"level": "L3", "tanya": "Pasangan kitab dan nabi penerima yang benar adalah ...", "opsi": ["Al-Qur'an-Nabi Muhammad saw.", "Zabur-Nabi Isa a.s.", "Injil-Nabi Daud a.s.", "Taurat-Nabi Muhammad saw."], "kunci": 0, "bahas": "Al-Qur'an diturunkan kepada Nabi Muhammad saw."}, {"level": "L3", "tanya": "Rafi dititipi pesan rahasia dan tidak menyebarkannya. Sikap Rafi meneladani akhlak ...", "opsi": ["hasad", "takabur", "amanah", "riya"], "kunci": 2, "bahas": "Menjaga rahasia titipan adalah bentuk amanah."}]}, {"kelas": 4, "mapel": "Al-Qur'an Hadis", "topik": "Hukum idgham bighunnah, idgham bilaghunnah, iqlab, hadis niat, dan silaturahmi", "materi": "Idgham bighunnah terjadi ketika nun sukun atau tanwin bertemu huruf ya, nun, mim, atau waw dan dibaca dengung. Idgham bilaghunnah terjadi pada huruf lam dan ra tanpa dengung, sedangkan iqlab mengubah bunyi nun sukun atau tanwin menjadi mim ketika bertemu ba. Jangan tertukar: iqlab hanya terjadi sebelum huruf ba, bukan sebelum semua huruf.", "soal": [{"level": "L1", "tanya": "Huruf idgham bighunnah adalah ...", "opsi": ["lam dan ra", "ya, nun, mim, waw", "ba saja", "hamzah dan ha"], "kunci": 1, "bahas": "Idgham bighunnah terjadi pada huruf ya, nun, mim, dan waw."}, {"level": "L1", "tanya": "Idgham bilaghunnah dibaca ...", "opsi": ["sangat panjang", "berhenti", "dengan dengung", "tanpa dengung"], "kunci": 3, "bahas": "Idgham bilaghunnah dibaca tanpa dengung."}, {"level": "L1", "tanya": "Iqlab terjadi ketika nun sukun atau tanwin bertemu huruf ...", "opsi": ["ba", "waw", "ra", "lam"], "kunci": 0, "bahas": "Iqlab terjadi sebelum huruf ba."}, {"level": "L2", "tanya": "Bacaan 'min rabbihim' termasuk ...", "opsi": ["idgham bighunnah", "iqlab", "idgham bilaghunnah", "izhar"], "kunci": 2, "bahas": "Nun sukun bertemu ra sehingga dibaca idgham bilaghunnah."}, {"level": "L2", "tanya": "Bacaan 'min ba'di' termasuk ...", "opsi": ["idgham bilaghunnah", "mad thabi'i", "iqlab", "idgham bighunnah"], "kunci": 2, "bahas": "Nun sukun bertemu ba sehingga bunyinya berubah menjadi mim melalui iqlab."}, {"level": "L2", "tanya": "Hadis 'innamal a'malu binniyyat' mengajarkan bahwa amal bergantung pada ...", "opsi": ["niat", "jumlah amal", "harta", "pujian orang"], "kunci": 0, "bahas": "Hadis tersebut menegaskan amal dinilai berdasarkan niat."}, {"level": "L3", "tanya": "Bacaan 'man ya'mal' dibaca dengung karena nun sukun bertemu huruf ...", "opsi": ["ra", "ba", "lam", "ya"], "kunci": 3, "bahas": "Nun sukun bertemu ya termasuk idgham bighunnah sehingga dibaca dengung."}, {"level": "L3", "tanya": "Ahmad menyambung silaturahmi dengan mengunjungi kerabatnya. Keutamaan yang disebutkan dalam hadis adalah ...", "opsi": ["tidak perlu beribadah", "rezeki dilapangkan dan umur diberkahi", "selalu menang lomba", "pasti menjadi kaya"], "kunci": 1, "bahas": "Hadis menyebutkan silaturahmi melapangkan rezeki dan memberkahi umur."}]}, {"kelas": 4, "mapel": "Bahasa Arab", "topik": "Alamat, profesi, dan cita-cita", "materi": "Kosakata semester ini meliputi al-'unwan yang berarti alamat, al-mihnah yang berarti profesi, dan amali yang berarti cita-citaku. Kata tanya ma digunakan untuk benda, man untuk orang, aina untuk tempat, dan kam untuk jumlah. Jangan tertukar: tabibun berarti dokter, sedangkan mudarrisun berarti guru.", "soal": [{"level": "L1", "tanya": "Al-'unwan artinya ...", "opsi": ["profesi", "alamat", "cita-cita", "sekolah"], "kunci": 1, "bahas": "Al-'unwan berarti alamat."}, {"level": "L1", "tanya": "Tabibun artinya ...", "opsi": ["petani", "polisi", "guru", "dokter"], "kunci": 3, "bahas": "Tabibun berarti dokter."}, {"level": "L1", "tanya": "Kata tanya untuk menanyakan tempat adalah ...", "opsi": ["aina", "kam", "ma", "man"], "kunci": 0, "bahas": "Aina berarti di mana dan digunakan untuk menanyakan tempat."}, {"level": "L2", "tanya": "Orang yang mengajar siswa di kelas disebut ...", "opsi": ["fallahun", "syurtiyyun", "mudarrisun", "muhandisun"], "kunci": 2, "bahas": "Mudarrisun berarti guru."}, {"level": "L2", "tanya": "Pertanyaan 'kam 'umruka?' menanyakan ...", "opsi": ["alamat", "profesi", "umur", "nama"], "kunci": 2, "bahas": "Kam digunakan untuk menanyakan jumlah, termasuk umur."}, {"level": "L2", "tanya": "Cita-cita menjadi dokter dalam bahasa Arab dapat diungkapkan dengan ...", "opsi": ["amali an akuna tabiban", "aina al-maktabah", "'unwani fil madrasah", "hadza fallahun"], "kunci": 0, "bahas": "Ungkapan itu berarti cita-citaku menjadi dokter."}, {"level": "L3", "tanya": "Kalimat yang tepat untuk menanyakan profesi seseorang adalah ...", "opsi": ["ma ismuka?", "aina baituka?", "kam kitabun 'indaka?", "ma mihnatuka?"], "kunci": 3, "bahas": "Ma mihnatuka berarti apa profesimu."}, {"level": "L3", "tanya": "Rina tinggal di Jalan Melati dan ingin menjadi guru. Pasangan kosakata yang sesuai adalah ...", "opsi": ["amali dan qittun", "al-'unwan dan mudarrisah", "aina dan humma", "al-mihnah dan samakah"], "kunci": 1, "bahas": "Alamat berkaitan dengan al-'unwan dan guru perempuan disebut mudarrisah."}]}, {"kelas": 4, "mapel": "Bahasa Indonesia", "topik": "Kalimat transitif dan intransitif, ide pokok dan pendukung, serta teks deskripsi", "materi": "Kalimat transitif mempunyai objek, sedangkan kalimat intransitif tidak mempunyai objek. Ide pokok adalah gagasan utama paragraf dan ide pendukung memberi rincian, sedangkan teks deskripsi menggambarkan objek secara rinci. Jangan tertukar: kata kerja saja belum tentu transitif jika tidak diikuti objek.", "soal": [{"level": "L1", "tanya": "Kalimat yang mempunyai objek disebut kalimat ...", "opsi": ["intransitif", "tanya", "perintah", "transitif"], "kunci": 3, "bahas": "Kalimat transitif mempunyai objek."}, {"level": "L1", "tanya": "Ide pendukung berfungsi untuk ...", "opsi": ["menjadi judul", "memberi rincian ide pokok", "mengakhiri teks", "mengganti ide pokok"], "kunci": 1, "bahas": "Ide pendukung memberi rincian dan penjelasan terhadap ide pokok."}, {"level": "L1", "tanya": "Teks yang menggambarkan benda atau tempat secara rinci disebut teks ...", "opsi": ["narasi", "prosedur", "deskripsi", "wawancara"], "kunci": 2, "bahas": "Teks deskripsi menggambarkan objek secara rinci."}, {"level": "L2", "tanya": "Kalimat transitif adalah ...", "opsi": ["Ibu memasak nasi.", "Adik berlari.", "Burung terbang.", "Ayah duduk."], "kunci": 0, "bahas": "Kata nasi adalah objek dari memasak sehingga kalimatnya transitif."}, {"level": "L2", "tanya": "Kalimat intransitif adalah ...", "opsi": ["Mereka tertawa.", "Rudi menendang bola.", "Guru menulis surat.", "Siti membaca buku."], "kunci": 0, "bahas": "Kata tertawa tidak mempunyai objek sehingga kalimatnya intransitif."}, {"level": "L2", "tanya": "Paragraf: 'Perpustakaan sekolah kami bersih. Buku-bukunya tersusun rapi dan lantainya selalu disapu.' Ide pendukungnya adalah ...", "opsi": ["siswa suka membaca", "perpustakaan sekolah kami bersih", "buku tersusun rapi dan lantai disapu", "sekolah kami besar"], "kunci": 2, "bahas": "Kalimat kedua merinci kebersihan perpustakaan."}, {"level": "L3", "tanya": "Kalimat 'Kakak menyapu halaman' termasuk transitif karena ...", "opsi": ["mempunyai subjek saja", "kata halaman menjadi objek", "terjadi di halaman", "tidak mempunyai objek"], "kunci": 1, "bahas": "Halaman adalah objek yang dikenai perbuatan menyapu."}, {"level": "L3", "tanya": "Deskripsi yang paling rinci tentang taman adalah ...", "opsi": ["Saya pergi ke taman.", "Taman adalah tempat bermain.", "Taman itu bagus.", "Taman itu hijau, bunganya warna-warni, dan udaranya sejuk."], "kunci": 3, "bahas": "Kalimat itu menggambarkan warna, bunga, dan suasana taman secara rinci."}]}, {"kelas": 4, "mapel": "Fikih", "topik": "Khitan, tanda-tanda balig, dan tata cara mandi wajib", "materi": "Khitan adalah pemotongan kulup pada laki-laki dan termasuk syariat yang menjaga kebersihan. Seseorang menjadi mukallaf setelah balig, ditandai haid bagi perempuan, ihtilam bagi laki-laki, atau genap lima belas tahun qamariah. Jangan tertukar: mandi wajib harus diawali niat, sedangkan wudu saja tidak menggantikan mandi wajib.", "soal": [{"level": "L1", "tanya": "Muslim yang balig dan berakal sehingga wajib menjalankan syariat disebut ...", "opsi": ["muallaf", "muballigh", "musafir", "mukallaf"], "kunci": 3, "bahas": "Mukallaf adalah muslim balig dan berakal yang dibebani hukum syariat."}, {"level": "L1", "tanya": "Tanda balig umum bagi laki-laki dan perempuan adalah genap berusia ...", "opsi": ["12 tahun qamariah", "15 tahun qamariah", "20 tahun qamariah", "10 tahun qamariah"], "kunci": 1, "bahas": "Genap lima belas tahun qamariah adalah tanda balig umum."}, {"level": "L1", "tanya": "Rukun pertama mandi wajib adalah ...", "opsi": ["memakai sabun", "berwudu", "niat", "menyiram kaki"], "kunci": 2, "bahas": "Niat adalah rukun mandi wajib."}, {"level": "L2", "tanya": "Perempuan yang telah selesai haid wajib ...", "opsi": ["mandi wajib sebelum salat", "salat tanpa bersuci", "hanya berwudu", "mengganti salat dengan sedekah"], "kunci": 0, "bahas": "Setelah haid selesai, perempuan wajib mandi wajib sebelum salat."}, {"level": "L2", "tanya": "Urutan mandi wajib yang benar dimulai dengan ...", "opsi": ["berniat lalu membersihkan kotoran dan berwudu", "berwudu lalu berniat di akhir", "langsung salat", "menyiram seluruh badan tanpa niat"], "kunci": 0, "bahas": "Mandi wajib dimulai dengan niat, membersihkan kotoran, berwudu, lalu menyiram seluruh tubuh."}, {"level": "L2", "tanya": "Khitan pada laki-laki bermanfaat untuk ...", "opsi": ["mengganti mandi wajib", "menghilangkan kewajiban salat", "menjaga kebersihan dan kesehatan", "membuat seseorang mukallaf"], "kunci": 2, "bahas": "Khitan membantu menjaga kebersihan dan kesehatan."}, {"level": "L3", "tanya": "Ahmad berusia lima belas tahun qamariah tetapi belum ihtilam. Status Ahmad adalah ...", "opsi": ["belum balig", "sudah balig berdasarkan usia", "belum mukallaf", "tidak wajib salat"], "kunci": 1, "bahas": "Usia lima belas tahun qamariah menjadi tanda balig umum."}, {"level": "L3", "tanya": "Fatimah lupa niat ketika mandi wajib hingga selesai. Tindakan yang benar adalah ...", "opsi": ["berwudu saja", "bertayamum", "langsung salat", "mengulang mandi wajib dengan niat"], "kunci": 3, "bahas": "Mandi wajib tanpa niat tidak sah sehingga harus diulang."}]}, {"kelas": 4, "mapel": "Fikih (Sem 1)", "topik": "Tanda Balig dan Mandi Wajib", "materi": "Pendalaman Materi: Ketentuan Balig & Bersuci Muslim yang telah balig berstatus mukallaf , artinya wajib menjalankan perintah syariat seperti salat 5 waktu dan puasa Ramadan. Tabel Anti-Miskonsepsi Tanda Balig Kategori Tanda Balig Batas Usia Hijriah Khusus Perempuan Mengalami haid Minimal 9 tahun qamariah Khusus Laki-laki Mengalami ihtilam (mimpi basah) Minimal 9 tahun qamariah Umum Keduanya Mencapai usia 15 tahun meski belum haid/mimpi basah Genap 15 tahun qamariah Modul Pengayaan Kasus: Aisyah selesai haid pukul 16.30 WIB (waktu Asar). Setelah mandi wajib sebelum Magrib, salat apa yang wajib segera dikerjakan? Kunci: Salat Asar terlebih dahulu, lalu salat Magrib saat waktunya tiba.", "soal": [{"level": "L1", "tanya": "Muslim yang sudah balig dan berakal sehat sehingga wajib menanggung beban hukum syariat disebut ....", "opsi": ["muballigh", "mukallaf", "muallaf", "muttaqin"], "kunci": 1, "bahas": "Mukallaf adalah muslim balig dan berakal yang wajib menjalankan perintah dan menjauhi larangan agama."}, {"level": "L2", "tanya": "Ahmad telah genap berusia 15 tahun qamariah, namun belum pernah mengalami mimpi basah. Status hukum Ahmad adalah ....", "opsi": ["belum balig sampai bermimpi basah", "sudah balig berdasarkan usia", "belum wajib salat fardu", "cukup berwudu jika berhadas besar"], "kunci": 1, "bahas": "Usia genap 15 tahun qamariah menjadi tanda balig umum bagi laki-laki maupun perempuan."}, {"level": "L3", "tanya": "Fatimah selesai haid lalu mandi wajib, tetapi ia lupa membaca niat hingga selesai menyiram seluruh tubuh. Tindakan yang benar agar salatnya sah adalah ....", "opsi": ["langsung berwudu lalu salat", "mengulang mandi wajib disertai niat", "membaca niat saja tanpa mandi", "mengganti dengan tayamum"], "kunci": 1, "bahas": "Niat merupakan rukun mandi wajib. Tanpa niat di awal membasuh tubuh, mandi wajib tidak sah dan harus diulang."}]}, {"kelas": 4, "mapel": "IPAS", "topik": "Bagian tumbuhan dan fotosintesis, gaya dan gerak, perubahan bentuk energi, serta peta", "materi": "Tumbuhan menggunakan akar, batang, daun, bunga, dan buah untuk hidup dan berkembang biak. Fotosintesis menghasilkan makanan dan oksigen, gaya dapat mengubah gerak benda, energi dapat berubah bentuk, dan peta menggunakan simbol serta arah mata angin. Jangan tertukar: gesekan umumnya memperlambat gerak, sedangkan gravitasi menarik benda ke bumi.", "soal": [{"level": "L1", "tanya": "Bagian tumbuhan yang menyerap air dari tanah adalah ...", "opsi": ["daun", "akar", "bunga", "buah"], "kunci": 1, "bahas": "Akar menyerap air dan zat hara dari tanah."}, {"level": "L1", "tanya": "Fotosintesis menghasilkan ...", "opsi": ["minyak bumi", "listrik", "karbon dioksida saja", "makanan dan oksigen"], "kunci": 3, "bahas": "Fotosintesis menghasilkan makanan bagi tumbuhan dan oksigen."}, {"level": "L1", "tanya": "Gaya yang menarik benda jatuh ke bumi disebut ...", "opsi": ["gravitasi", "pegas", "gesek", "magnet"], "kunci": 0, "bahas": "Gravitasi menarik benda menuju bumi."}, {"level": "L2", "tanya": "Daun hijau berperan penting dalam fotosintesis karena mengandung ...", "opsi": ["protein", "lemak", "klorofil", "garam"], "kunci": 2, "bahas": "Klorofil pada daun membantu menangkap cahaya matahari."}, {"level": "L2", "tanya": "Bola yang menggelinding di lantai kasar lebih cepat berhenti karena ...", "opsi": ["energi cahaya", "gaya magnet", "gaya gesek besar", "gravitasi hilang"], "kunci": 2, "bahas": "Permukaan kasar menimbulkan gaya gesek besar yang memperlambat bola."}, {"level": "L2", "tanya": "Lampu mengubah energi listrik menjadi energi ...", "opsi": ["cahaya dan panas", "potensial saja", "gerak dan bunyi", "kimia saja"], "kunci": 0, "bahas": "Lampu mengubah energi listrik menjadi cahaya dan panas."}, {"level": "L3", "tanya": "Tumbuhan diletakkan di tempat gelap selama beberapa hari. Akibat yang paling mungkin adalah ...", "opsi": ["fotosintesis meningkat", "akar berubah menjadi bunga", "tumbuhan menghasilkan lebih banyak oksigen", "daun menguning dan pertumbuhan terganggu"], "kunci": 3, "bahas": "Tanpa cahaya, fotosintesis terganggu sehingga tumbuhan tidak sehat."}, {"level": "L3", "tanya": "Pada peta, simbol bintang biasanya menunjukkan ...", "opsi": ["gunung", "ibu kota", "jalan", "sungai"], "kunci": 1, "bahas": "Simbol bintang pada peta umumnya menunjukkan ibu kota."}]}, {"kelas": 4, "mapel": "Matematika", "topik": "Bilangan sampai 10.000, pecahan desimal dan persen, serta pola bilangan", "materi": "Bilangan sampai 10.000 dibaca berdasarkan nilai tempat ribuan, ratusan, puluhan, dan satuan. Pecahan dapat diubah menjadi desimal dan persen, sedangkan pola bilangan ditentukan oleh aturan perubahan antar suku. Jangan tertukar: 0,5 sama dengan 50%, bukan 5%.", "soal": [{"level": "L1", "tanya": "Nilai tempat angka 6 pada bilangan 6.482 adalah ...", "opsi": ["ribuan", "satuan", "puluhan", "ratusan"], "kunci": 0, "bahas": "Angka 6 pada 6.482 menempati tempat ribuan."}, {"level": "L1", "tanya": "Bentuk persen dari 0,25 adalah ...", "opsi": ["250%", "0,25%", "25%", "2,5%"], "kunci": 2, "bahas": "Nol koma dua puluh lima sama dengan dua puluh lima persen."}, {"level": "L1", "tanya": "Pola 3, 6, 9, 12, ... bilangan berikutnya adalah ...", "opsi": ["16", "15", "13", "14"], "kunci": 1, "bahas": "Pola bertambah tiga sehingga bilangan berikutnya adalah lima belas."}, {"level": "L2", "tanya": "Bilangan 7.305 dibaca ...", "opsi": ["tujuh ribu tiga puluh lima", "tujuh ratus tiga puluh lima", "tujuh ribu lima", "tujuh ribu tiga ratus lima"], "kunci": 3, "bahas": "Bilangan 7.305 dibaca tujuh ribu tiga ratus lima."}, {"level": "L2", "tanya": "Pecahan 3/4 dalam bentuk desimal adalah ...", "opsi": ["0,43", "7,5", "0,34", "0,75"], "kunci": 3, "bahas": "Tiga dibagi empat sama dengan nol koma tujuh lima."}, {"level": "L2", "tanya": "Pola 5, 9, 13, 17, ... aturan pola itu adalah ...", "opsi": ["bertambah 5", "bertambah 4", "bertambah 3", "berkurang 4"], "kunci": 1, "bahas": "Setiap bilangan bertambah empat dari bilangan sebelumnya."}, {"level": "L3", "tanya": "Diskon 20% dari harga Rp50.000 adalah ...", "opsi": ["Rp5.000", "Rp20.000", "Rp10.000", "Rp25.000"], "kunci": 2, "bahas": "Dua puluh persen dari lima puluh ribu adalah sepuluh ribu."}, {"level": "L3", "tanya": "Pola 2, 6, 12, 20, 30, ... bilangan berikutnya adalah ...", "opsi": ["42", "40", "44", "36"], "kunci": 0, "bahas": "Selisih pola bertambah 4, 6, 8, 10, lalu 12 sehingga berikutnya 42."}]}, {"kelas": 4, "mapel": "Pendidikan Pancasila", "topik": "Pancasila sebagai nilai kehidupan serta keseimbangan hak dan kewajiban warga", "materi": "Nilai Pancasila menjadi pedoman dalam kehidupan keluarga, sekolah, dan masyarakat. Warga negara mempunyai hak seperti memperoleh pendidikan dan perlindungan, serta kewajiban seperti menaati hukum, menjaga ketertiban, dan menghormati hak orang lain. Jangan tertukar: menggunakan hak tidak boleh merugikan hak orang lain.", "soal": [{"level": "L1", "tanya": "Sila pertama Pancasila berbunyi ...", "opsi": ["Kemanusiaan yang adil dan beradab", "Persatuan Indonesia", "Ketuhanan Yang Maha Esa", "Keadilan sosial bagi seluruh rakyat Indonesia"], "kunci": 2, "bahas": "Sila pertama Pancasila adalah Ketuhanan Yang Maha Esa."}, {"level": "L1", "tanya": "Kewajiban warga negara adalah ...", "opsi": ["menaati hukum", "mengabaikan aturan", "mengganggu ketertiban", "merusak fasilitas umum"], "kunci": 0, "bahas": "Menaati hukum adalah kewajiban warga negara."}, {"level": "L1", "tanya": "Hak warga negara adalah ...", "opsi": ["merusak lingkungan", "melanggar aturan", "mengambil hak orang lain", "memperoleh pendidikan"], "kunci": 3, "bahas": "Memperoleh pendidikan adalah hak warga negara."}, {"level": "L2", "tanya": "Musyawarah untuk memilih ketua kelas mencerminkan sila ...", "opsi": ["pertama", "keempat", "kedua", "kelima"], "kunci": 1, "bahas": "Musyawarah mufakat mencerminkan sila keempat Pancasila."}, {"level": "L2", "tanya": "Membantu teman yang berbeda agama menunjukkan nilai ...", "opsi": ["kekuasaan", "kemanusiaan dan toleransi", "kesombongan", "persaingan"], "kunci": 1, "bahas": "Membantu sesama tanpa membedakan agama menunjukkan kemanusiaan dan toleransi."}, {"level": "L2", "tanya": "Siswa berhak menggunakan perpustakaan dan wajib ...", "opsi": ["menyembunyikan buku", "merobek buku", "berbicara keras", "mengembalikan buku tepat waktu"], "kunci": 3, "bahas": "Mengembalikan buku tepat waktu adalah kewajiban pengguna perpustakaan."}, {"level": "L3", "tanya": "Warga menggunakan jalan umum untuk berdagang sampai menutup seluruh jalan. Tindakan itu tidak seimbang karena ...", "opsi": ["hak berdagang harus menghormati hak pengguna jalan", "berdagang dilarang selamanya", "jalan hanya untuk kendaraan", "warga tidak mempunyai hak"], "kunci": 0, "bahas": "Hak seseorang harus digunakan tanpa merugikan hak orang lain."}, {"level": "L3", "tanya": "Kelas mengadakan musyawarah dan semua pendapat didengar sebelum keputusan diambil. Nilai yang diterapkan adalah ...", "opsi": ["kekuasaan", "kebebasan tanpa aturan", "kerakyatan", "ketuhanan saja"], "kunci": 2, "bahas": "Musyawarah yang mendengar pendapat semua pihak mencerminkan kerakyatan."}]}, {"kelas": 4, "mapel": "SKI", "topik": "Ketabahan dakwah Nabi Muhammad saw., rahmatan lil 'alamin, dan hijrah ke Habasyah", "materi": "Dakwah Nabi Muhammad saw. dimulai secara sembunyi-sembunyi kemudian terang-terangan dan menghadapi penolakan dari kaum Quraisy. Sebagian sahabat hijrah ke Habasyah karena rajanya, Najasyi, dikenal adil, sedangkan Nabi Muhammad saw. diutus sebagai rahmat bagi seluruh alam. Jangan tertukar: hijrah ke Habasyah terjadi sebelum hijrah ke Madinah.", "soal": [{"level": "L1", "tanya": "Raja Habasyah yang adil bernama ...", "opsi": ["Najasyi", "Heraklius", "Kisra", "Firaun"], "kunci": 0, "bahas": "Raja Habasyah yang menerima kaum muslimin adalah Najasyi."}, {"level": "L1", "tanya": "Rahmatan lil 'alamin berarti rahmat bagi ...", "opsi": ["keluarga Nabi saja", "penduduk Madinah saja", "seluruh alam", "kaum Quraisy saja"], "kunci": 2, "bahas": "Rahmatan lil 'alamin berarti rahmat bagi seluruh alam."}, {"level": "L1", "tanya": "Dakwah Nabi Muhammad saw. pada awalnya dilakukan secara ...", "opsi": ["dengan peperangan", "sembunyi-sembunyi", "terang-terangan di pasar", "melalui surat ke raja"], "kunci": 1, "bahas": "Dakwah awal Nabi Muhammad saw. dilakukan secara sembunyi-sembunyi."}, {"level": "L2", "tanya": "Kaum muslimin hijrah ke Habasyah karena ...", "opsi": ["ingin berdagang", "diperintah raja Habasyah", "ingin meninggalkan Islam", "mencari perlindungan dari penindasan Quraisy"], "kunci": 3, "bahas": "Hijrah ke Habasyah bertujuan mencari perlindungan dari penindasan."}, {"level": "L2", "tanya": "Bilal bin Rabah menunjukkan ketabahan dengan ...", "opsi": ["meminta jabatan", "bersembunyi selamanya", "meninggalkan Islam", "tetap beriman meski disiksa"], "kunci": 3, "bahas": "Bilal tetap teguh beriman walaupun mengalami siksaan."}, {"level": "L2", "tanya": "Setelah dakwah terang-terangan, kaum Quraisy ...", "opsi": ["meninggalkan Makkah", "menolak dan menindas Nabi serta pengikutnya", "langsung semua masuk Islam", "mengangkat Nabi menjadi raja"], "kunci": 1, "bahas": "Kaum Quraisy menolak dakwah dan menindas Nabi Muhammad saw. beserta pengikutnya."}, {"level": "L3", "tanya": "Urutan peristiwa yang benar adalah ...", "opsi": ["hijrah ke Madinah lalu dakwah sembunyi-sembunyi", "Fathu Makkah lalu wahyu pertama", "dakwah sembunyi-sembunyi lalu hijrah ke Habasyah", "hijrah ke Habasyah lalu kelahiran Nabi"], "kunci": 2, "bahas": "Dakwah sembunyi-sembunyi terjadi sebelum hijrah ke Habasyah."}, {"level": "L3", "tanya": "Sikap Nabi Muhammad saw. yang menunjukkan rahmatan lil 'alamin adalah ...", "opsi": ["mendoakan dan bersabar menghadapi penolakan", "mengusir semua orang", "menolak menolong sesama", "membalas semua ejekan dengan kekerasan"], "kunci": 0, "bahas": "Kesabaran dan doa Nabi menunjukkan rahmat bagi manusia."}]}, {"kelas": 5, "mapel": "Akidah Akhlak", "topik": "Kalimat hauqalah, Al-Qawiyy, Al-Qayyum, iman kepada hari akhir, adab bertetangga, dan kisah Qarun", "materi": "Kalimat hauqalah menunjukkan bahwa tidak ada daya dan kekuatan kecuali dengan pertolongan Allah. Allah bersifat Al-Qawiyy yang berarti Maha Kuat dan Al-Qayyum yang berarti Maha Berdiri Sendiri serta mengurus makhluk-Nya. Iman kepada hari akhir mendorong manusia beramal saleh dan berakhlak baik kepada tetangga. Jangan tertukar: Qarun binasa bukan karena hartanya banyak, melainkan karena sombong dan tidak mensyukuri nikmat Allah.", "soal": [{"level": "L1", "tanya": "Bunyi kalimat hauqalah adalah ....", "opsi": ["Subhanallah", "La haula wala quwwata illa billah", "Allahu Akbar", "Alhamdulillah"], "kunci": 1, "bahas": "Hauqalah adalah bacaan la haula wala quwwata illa billah."}, {"level": "L1", "tanya": "Asmaul Husna Al-Qawiyy berarti Allah Maha ....", "opsi": ["Pengampun", "Pencipta", "Kuat", "Melihat"], "kunci": 2, "bahas": "Al-Qawiyy berarti Allah Mahakuat dan tidak ada yang dapat mengalahkan kekuasaan-Nya."}, {"level": "L1", "tanya": "Al-Qayyum menunjukkan bahwa Allah ....", "opsi": ["membutuhkan bantuan makhluk", "selalu mengantuk", "berubah-ubah", "berdiri sendiri dan mengurus makhluk-Nya"], "kunci": 3, "bahas": "Al-Qayyum berarti Allah Mahaberdiri Sendiri dan terus mengurus seluruh makhluk-Nya."}, {"level": "L2", "tanya": "Seorang siswa menghadapi tugas sulit, lalu berusaha dan membaca hauqalah. Makna sikap tersebut adalah ....", "opsi": ["menyerah sebelum berusaha", "mengandalkan teman sepenuhnya", "tidak perlu belajar", "meminta pertolongan Allah sambil tetap berusaha"], "kunci": 3, "bahas": "Hauqalah mengajarkan manusia mengakui kekuasaan Allah sambil tetap melakukan ikhtiar."}, {"level": "L2", "tanya": "Perilaku yang menunjukkan adab bertetangga adalah ....", "opsi": ["membuat suara gaduh pada malam hari", "membuang sampah ke halaman tetangga", "menjenguk tetangga yang sakit", "mengambil barang tetangga tanpa izin"], "kunci": 2, "bahas": "Menjenguk tetangga yang sakit merupakan bentuk kepedulian dan adab bertetangga."}, {"level": "L2", "tanya": "Peristiwa pada hari akhir ketika amal manusia ditimbang disebut ....", "opsi": ["sangkakala", "mizan", "barzakh", "syafaat"], "kunci": 1, "bahas": "Mizan adalah timbangan amal manusia pada hari akhir."}, {"level": "L3", "tanya": "Seorang pedagang memperoleh keuntungan besar, lalu menganggap keberhasilannya semata-mata karena kepandaiannya dan menolak bersedekah. Kisah yang paling tepat menjadi peringatan baginya adalah kisah ....", "opsi": ["Qarun", "Nabi Yunus a.s.", "Bilal bin Rabah", "Nabi Ayub a.s."], "kunci": 0, "bahas": "Qarun sombong terhadap hartanya dan tidak bersyukur sehingga Allah membenamkannya ke bumi."}, {"level": "L3", "tanya": "Urutan peristiwa hari akhir yang benar adalah ....", "opsi": ["kebangkitan, hisab, mizan, surga atau neraka", "hisab, kebangkitan, mizan, surga atau neraka", "mizan, hisab, kebangkitan, surga atau neraka", "surga atau neraka, mizan, hisab, kebangkitan"], "kunci": 0, "bahas": "Manusia dibangkitkan, kemudian dihisab dan ditimbang amalnya sebelum menerima balasan surga atau neraka."}]}, {"kelas": 5, "mapel": "Al-Qur'an Hadis", "topik": "QS. Al-'Adiyat, At-Tin, Al-Ma'un, hukum mim sukun, dan hadis anak yatim", "materi": "QS. Al-'Adiyat mengingatkan manusia agar tidak ingkar terhadap nikmat Allah dan menyadari bahwa amal akan diperlihatkan pada hari kebangkitan. QS. At-Tin menegaskan manusia diciptakan dalam bentuk terbaik, sedangkan QS. Al-Ma'un melarang menghardik anak yatim dan enggan menolong sesama. Hukum mim sukun meliputi ikhfa syafawi, idgham mimi, dan izhar syafawi. Jangan tertukar: hukum mim sukun berlaku ketika mim sukun bertemu huruf hijaiyah, bukan ketika nun sukun
